<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">VibeShop architecture</title>
  <desc id="d">A request travels from JSP pages through access filters to servlets, DAO classes and the SQL database, then returns to the browser.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .pkt{filter:drop-shadow(0 0 4px #3ddc97)}
    .glow{animation:glow 6s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="1" y="1" width="898" height="338" rx="14" fill="#0b0f14" stroke="#243242" stroke-width="2"/>

  <text class="m" x="36" y="48" font-size="22" font-weight="700" fill="#e6f1ff">VibeShop · Turbo Layout</text>
  <text class="m" x="36" y="74" font-size="14" fill="#9fb3c8">Team project, University of Salerno · Java web application for live-music commerce · role: team lead</text>

  <!-- connectors drawn first so boxes cover the line -->
  <path id="route" d="M111 195H343H575H793" fill="none" stroke="#243242" stroke-width="2"/>
  <g fill="#243242">
    <path d="M258 195l-8-5v10z"/>
    <path d="M500 195l-8-5v10z"/>
    <path d="M722 195l-8-5v10z"/>
  </g>
  <!-- layers -->
  <g class="m" font-size="14" text-anchor="middle">
    <rect x="36" y="150" width="150" height="90" rx="10" fill="#111821" stroke="#5ad1ff" stroke-width="1.5"/>
    <text x="111" y="186" fill="#5ad1ff" font-weight="700">JSP pages</text>
    <text x="111" y="208" fill="#9fb3c8" font-size="12">catalogue · cart</text>
    <text x="111" y="224" fill="#9fb3c8" font-size="12">checkout · orders</text>

    <rect x="258" y="150" width="170" height="90" rx="10" fill="#111821" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="343" y="180" fill="#3ddc97" font-weight="700">Servlets</text>
    <text x="343" y="200" fill="#9fb3c8" font-size="12">Cart · Checkout</text>
    <text x="343" y="216" fill="#9fb3c8" font-size="12">Login · Search</text>

    <rect x="500" y="150" width="150" height="90" rx="10" fill="#111821" stroke="#f5c451" stroke-width="1.5"/>
    <text x="575" y="186" fill="#f5c451" font-weight="700">DAO</text>
    <text x="575" y="208" fill="#9fb3c8" font-size="12">user · concert</text>
    <text x="575" y="224" fill="#9fb3c8" font-size="12">product · order</text>

    <rect x="722" y="150" width="142" height="90" rx="10" fill="#111821" stroke="#b79cff" stroke-width="1.5"/>
    <text x="793" y="186" fill="#b79cff" font-weight="700">SQL</text>
    <text x="793" y="208" fill="#9fb3c8" font-size="12">VIBESHOP_FINAL</text>
    <text x="793" y="224" fill="#9fb3c8" font-size="12">.sql schema</text>
  </g>

  <!-- filters above servlets -->
  <g class="m" font-size="12" text-anchor="middle">
    <rect class="glow" x="226" y="100" width="234" height="30" rx="15" fill="#0f1a16" stroke="#3ddc97" stroke-dasharray="4 4"/>
    <text x="343" y="120" fill="#3ddc97">AuthFilter · AdminFilter</text>
  </g>

  <!-- connectors -->
  <circle class="pkt" r="6" fill="#3ddc97">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear">
      <mpath href="#route"/>
    </animateMotion>
  </circle>

  <text class="m" x="36" y="282" font-size="13" fill="#9fb3c8">Request: browser → filter → servlet → DAO → database, then the response returns the same way.</text>
  <text class="m" x="36" y="306" font-size="13" fill="#7a8ba0">Stack: Java · JSP · Servlets · SQL · DAO · HTML/CSS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
