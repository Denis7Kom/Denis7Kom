<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">whoami terminal</title>
  <desc id="d">Terminal window listing the handle den7best, role, focus, languages and work status.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:16px}
    .l{animation:show .25s backwards}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes show{from{opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.l{opacity:1!important}}
  </style>
  <rect x="1" y="1" width="898" height="358" rx="12" fill="#0b0f14" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="38" rx="12" fill="#111821"/>
  <rect x="1" y="26" width="898" height="13" fill="#111821"/>
  <circle cx="26" cy="20" r="6" fill="#ff6b6b"/>
  <circle cx="48" cy="20" r="6" fill="#f5c451"/>
  <circle cx="70" cy="20" r="6" fill="#3ddc97"/>
  <text class="m" x="450" y="25" font-size="13" fill="#7a8ba0" text-anchor="middle">den7best@naples: ~</text>
  <g class="m">
    <g class="l" style="animation-delay:0.4s">
      <text x="32" y="78" fill="#3ddc97">$ <tspan fill="#e6f1ff">whoami</tspan></text>
      <text x="48" y="102" fill="#5ad1ff">den7best</text>
    </g>
    <g class="l" style="animation-delay:1.4s">
      <text x="32" y="136" fill="#3ddc97">$ <tspan fill="#e6f1ff">cat role.txt</tspan></text>
      <text x="48" y="160" fill="#9fb3c8">Computer Science student (L-31), University of Salerno</text>
    </g>
    <g class="l" style="animation-delay:2.4s">
      <text x="32" y="194" fill="#3ddc97">$ <tspan fill="#e6f1ff">cat focus.txt</tspan></text>
      <text x="48" y="218" fill="#9fb3c8">Java web apps · SQL · access control · OWASP Top 10 (learning)</text>
    </g>
    <g class="l" style="animation-delay:3.4s">
      <text x="32" y="252" fill="#3ddc97">$ <tspan fill="#e6f1ff">cat languages.txt</tspan></text>
      <text x="48" y="276" fill="#9fb3c8">Russian (native) · Italian B2 · English B2 · German A2</text>
    </g>
    <g class="l" style="animation-delay:4.4s">
      <text x="32" y="310" fill="#3ddc97">$ <tspan fill="#e6f1ff">cat status.txt</tspan></text>
      <text x="48" y="334" fill="#f5c451">open to work · Naples, Italy<tspan class="blink" fill="#3ddc97"> _</tspan></text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
