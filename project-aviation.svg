<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">denis-aviation</title>
  <desc id="d">Radar display with a rotating sweep next to the project name and a short description of the interactive aviation project.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sweep{transform-origin:170px 170px;animation:spin 6s linear infinite}
    .blip{animation:blip 6s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes blip{0%,100%{opacity:.25}40%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="338" rx="14" fill="#0b0f14" stroke="#243242" stroke-width="2"/>

  <!-- radar -->
  <g>
    <circle cx="170" cy="170" r="120" fill="#0d1520" stroke="#243242" stroke-width="2"/>
    <circle cx="170" cy="170" r="80" fill="none" stroke="#1d2a38"/>
    <circle cx="170" cy="170" r="40" fill="none" stroke="#1d2a38"/>
    <path d="M50 170H290M170 50V290" stroke="#1d2a38"/>
    <g class="sweep">
      <path d="M170 170L290 170A120 120 0 0 0 255 85Z" fill="url(#beam)"/>
      <path d="M170 170H290" stroke="#3ddc97" stroke-width="2"/>
    </g>
    <circle class="blip" cx="230" cy="120" r="4" fill="#5ad1ff"/>
    <circle class="blip" cx="120" cy="215" r="4" fill="#f5c451" style="animation-delay:2s"/>
    <circle class="blip" cx="190" cy="250" r="4" fill="#5ad1ff" style="animation-delay:4s"/>
  </g>

  <text class="m" x="350" y="104" font-size="22" font-weight="700" fill="#e6f1ff">denis-aviation</text>
  <text class="m" x="350" y="132" font-size="14" fill="#9fb3c8">Interactive aviation project · JavaScript</text>

  <g class="m" font-size="14" fill="#9fb3c8">
    <text x="350" y="178"><tspan fill="#3ddc97">&gt;</tspan> interactive aircraft model</text>
    <text x="350" y="204"><tspan fill="#3ddc97">&gt;</tspan> controls tied to visible aircraft state</text>
    <text x="350" y="230"><tspan fill="#3ddc97">&gt;</tspan> live demo on GitHub Pages</text>
  </g>
  <text class="m" x="350" y="290" font-size="13" fill="#7a8ba0">Source: github.com/Denis7Kom/denis-aviation</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
