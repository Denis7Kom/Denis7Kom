<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-label="Application security: trace input, inspect access, review code, verify fixes"><title>Application security: trace input, inspect access, review code, verify fixes</title><defs><linearGradient id="bg"><stop stop-color="#121e2d"/><stop offset="1" stop-color="#0d1117"/></linearGradient><linearGradient id="line"><stop stop-color="#35d0ba"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="typing"><rect width="960" height="160" class="type-mask"/></clipPath></defs><style>text{font-family:Consolas,monospace;fill:#e6edf3}.muted{fill:#9dacc1}.accent{fill:#35d0ba}.rise{animation:rise 8s ease-in-out infinite;animation-delay:var(--delay,0s)}.pulse{animation:pulse 4s ease-in-out infinite}.trace{stroke-dasharray:18 230;animation:trace 6s linear infinite}.float{animation:float 5s ease-in-out infinite}.type-mask{animation:type 8s steps(44) infinite}.scan{animation:scan 7s ease-in-out infinite}@keyframes rise{0%,4%{opacity:0;transform:translateY(9px)}15%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}@keyframes pulse{50%{opacity:.4}}@keyframes trace{to{stroke-dashoffset:-496}}@keyframes float{50%{transform:translateY(-4px)}}@keyframes type{0%,3%{width:0px}35%,100%{width:960px}}@keyframes scan{50%{transform:translateX(45px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1}.type-mask{width:960px}}</style><rect x="1" y="1" width="958" height="158" rx="12" fill="url(#bg)" stroke="#2a3c51"/><text x="25" y="31" font-size="12" class="accent">SECURITY / CURRENT LEARNING PATH</text><g class="rise" style="--delay:0s"><rect x="25" y="58" width="205" height="55" rx="6" fill="#131f30" stroke="#35d0ba"/><text x="127" y="91" text-anchor="middle" font-size="16">TRACE INPUT</text></g><g class="rise" style="--delay:0.25s"><rect x="260" y="58" width="205" height="55" rx="6" fill="#131f30" stroke="#35d0ba"/><text x="362" y="91" text-anchor="middle" font-size="16">CHECK ACCESS</text></g><g class="rise" style="--delay:0.5s"><rect x="495" y="58" width="205" height="55" rx="6" fill="#131f30" stroke="#35d0ba"/><text x="597" y="91" text-anchor="middle" font-size="16">REVIEW CODE</text></g><g class="rise" style="--delay:0.75s"><rect x="730" y="58" width="205" height="55" rx="6" fill="#131f30" stroke="#f5c451"/><text x="832" y="91" text-anchor="middle" font-size="16">VERIFY FIXES</text></g><path class="trace" d="M25 138H935" stroke="url(#line)" stroke-width="2"/></svg>