<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 543" role="img" aria-labelledby="title">
  <title id="title">Su di me</title>
  <defs>
    <linearGradient id="panel" x2="100%" y2="100%"><stop stop-color="#060a0c"/><stop offset="1" stop-color="#102529"/></linearGradient>
    <radialGradient id="glow" cx=".86" cy=".28" r=".59"><stop stop-color="#126958" stop-opacity=".64"/><stop offset="1" stop-color="#126958" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#77d8c8" stroke-opacity=".11"/></pattern>
    <clipPath id="clip"><path d="M19 1H661L679 19V524L661 542H19L1 524V19Z"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="680" height="543" fill="url(#panel)"/>
    <rect width="680" height="543" fill="url(#glow)"/>
    <rect x="288" width="392" height="543" fill="url(#grid)"/>
  </g>
  <path d="M19 1H661L679 19V524L661 542H19L1 524V19Z" fill="none" stroke="#325751"/>
  <path d="M24 1h106m420 541h105" stroke="#71dbc7" stroke-opacity=".72" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="33" y="57" font-size="36" font-weight="650" fill="#f3faf8" text-anchor="start" letter-spacing="-0.6">Su di me</text>
    <g transform="translate(610 23) scale(0.9)" fill="none" stroke="#9ff6e2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="27" stroke="#5cd2b9" stroke-opacity=".38"/><circle cx="18" cy="18" r="32" stroke="#74dec8" stroke-opacity=".25" stroke-dasharray="2 4"/><circle cx="18" cy="10" r="6"/><path d="M5 31v-2a13 13 0 0 1 26 0v2"/></g>
    <path d="M34 79H646" stroke="#41635e" stroke-opacity=".72"/>
    <text x="34" y="114" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">Sono uno studente di Informatica (L-31) all’Università di</text>
    <text x="34" y="146" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">Salerno. Il progetto principale è VibeShop, un’applicazione</text>
    <text x="34" y="178" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">web Java per scoprire concerti e acquistare merchandising.</text>
    <text x="34" y="210" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">Ho guidato il gruppo di tre persone che l’ha realizzata.</text>
    <text x="34" y="242" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">Studio la sicurezza delle applicazioni web (OWASP Top 10</text>
    <text x="34" y="274" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">e SQL injection).</text>
    <text x="34" y="306" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">Non dichiaro certificazioni, audit o vulnerabilità segnalate.</text>
    <text x="34" y="356" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">Culobomb-Labs è un’associazione universitaria dell’UNISA</text>
    <text x="34" y="388" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">(L-31). Sviluppiamo strumenti per semplificare lo studio.</text>
    <text x="34" y="438" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">denis-aviation è un sito sull’aviazione virtuale e sul controllo</text>
    <text x="34" y="470" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">del traffico aereo, ancora in sviluppo.</text>
    <text x="34" y="502" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">Include una rete di voli interattiva e una demo ATC locale.</text>
  </g>
</svg>
