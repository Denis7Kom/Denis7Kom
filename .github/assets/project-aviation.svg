<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
  <title id="t">denis-aviation</title>
  <desc id="d">Radar display next to the project name: a virtual aviation and ATC website, live on GitHub Pages and in development. Planned: flight map and ATC radar.</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sweep{transform-origin:118px 150px;animation:spin 7s linear infinite}
.blip{animation:blip 7s ease-in-out infinite}
.dash{animation:dash 1.6s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,100%{opacity:.2}35%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes pulse{50%{opacity:.3}}
</style>
