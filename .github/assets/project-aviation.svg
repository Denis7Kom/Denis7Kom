<svg xmlns="http://www.w3.org/2000/svg" width="464" height="220" viewBox="0 0 464 220" role="img" aria-labelledby="title desc"><title id="title">Aviation — flight and aircraft portfolio</title><desc id="desc">Animated radar sweep, aircraft marker and route. Decorative graphic.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e2c"/><stop offset="1" stop-color="#102a2b"/></linearGradient><linearGradient id="beam"><stop stop-color="#79e6be" stop-opacity="0"/><stop offset="1" stop-color="#79e6be" stop-opacity=".22"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,"Liberation Mono",monospace} .muted{fill:#99adc7} .bright{fill:#eef5ff} .cyan{fill:#67e8f9} .purple{fill:#b4a0ff}.radar{transform-origin:366px 81px;animation:radar 12s linear infinite}.blip{animation:blip 4s ease-in-out infinite}.route{animation:route 12s linear infinite}@keyframes radar{to{transform:rotate(360deg)}}@keyframes blip{50%{opacity:.25}}@keyframes route{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".75" y=".75" width="462.5" height="218.5" rx="22" fill="#09111f" stroke="#25344a" stroke-width="1.5"/><rect x="2" y="2" width="460" height="216" rx="20" fill="url(#bg)"/><text x="24" y="32" font-size="11" fill="#8be9cc" class="mono">03 / AVIATION</text>
