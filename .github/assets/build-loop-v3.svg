<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="t d"><title id="t">My Build Pattern — a repeatable engineering loop</title><desc id="d">Animated design, model, implement, verify and improve workflow. Changes can return to earlier steps.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122437"/><stop offset="1" stop-color="#10121f"/></linearGradient><linearGradient id="rain" x2="1" y2="0"><stop stop-color="#35d0ba"/><stop offset=".6" stop-color="#9e8cf7"/><stop offset="1" stop-color="#f5c451"/></linearGradient></defs>
<style>text{font-family:Consolas,'Liberation Mono',monospace;fill:#e6edf3}.muted{fill:#9daec2}.cyan{fill:#35d0ba}.gold{fill:#f5c451}.violet{fill:#beaaff}.flow{stroke-dasharray:12 17;animation:flow 5s linear infinite}.return{stroke-dasharray:5 11;animation:flow 7s linear reverse infinite}.glow{animation:glow 5s ease-in-out infinite}.g2{animation:glow 5s -1s ease-in-out infinite}.g3{animation:glow 5s -2s ease-in-out infinite}.g4{animation:glow 5s -3s ease-in-out infinite}.g5{animation:glow 5s -4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-174}}@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="959" height="269" rx="14" fill="url(#bg)" stroke="#32465e"/>
<text x="25" y="32" font-size="12" class="cyan" letter-spacing="2">ENGINEERING LOOP / FROM REQUIREMENT TO EVIDENCE</text><text x="935" y="32" font-size="11" class="muted" text-anchor="end">ITERATE, DO NOT GUESS</text>
<path d="M90 120H873" stroke="#364b61" stroke-width="4"/><path d="M90 120H873" stroke="url(#rain)" stroke-width="4" class="flow"/>
<g><rect x="22" y="67" width="172" height="104" rx="10" fill="#102436" stroke="#367d75" class="glow"/><text x="37" y="87" font-size="11" class="cyan">01 / SCOPE</text><text x="37" y="116" font-size="19" font-weight="bold">UNDERSTAND</text><text x="37" y="143" font-size="11" class="muted">needs • constraints</text></g>
<g><rect x="208" y="67" width="172" height="104" rx="10" fill="#162238" stroke="#575c97" class="g2"/><text x="223" y="87" font-size="11" class="violet">02 / DESIGN</text><text x="223" y="116" font-size="19" font-weight="bold">MODEL</text><text x="223" y="143" font-size="11" class="muted">flows • contracts</text></g>
<g><rect x="394" y="67" width="172" height="104" rx="10" fill="#17223a" stroke="#575c97" class="g3"/><text x="409" y="87" font-size="11" class="violet">03 / EXECUTE</text><text x="409" y="116" font-size="19" font-weight="bold">IMPLEMENT</text><text x="409" y="143" font-size="11" class="muted">code • edge cases</text></g>
<g><rect x="580" y="67" width="172" height="104" rx="10" fill="#1d2234" stroke="#7b675b" class="g4"/><text x="595" y="87" font-size="11" class="gold">04 / VALIDATE</text><text x="595" y="116" font-size="19" font-weight="bold">VERIFY</text><text x="595" y="143" font-size="11" class="muted">tests • review</text></g>
<g><rect x="766" y="67" width="172" height="104" rx="10" fill="#1d2634" stroke="#368173" class="g5"/><text x="781" y="87" font-size="11" class="cyan">05 / EVOLVE</text><text x="781" y="116" font-size="19" font-weight="bold">REFINE</text><text x="781" y="143" font-size="11" class="muted">measure • document</text></g>
<path d="M848 173v38H110v-38" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 11" class="return"/>
<path d="m104 182 6-11 6 11" fill="none" stroke="#b9a9ff" stroke-width="2"/><text x="480" y="206" text-anchor="middle" font-size="11" class="violet">FEEDBACK LOOP → REVISIT ASSUMPTIONS</text>
<text x="27" y="250" font-size="11" class="muted">OUTPUTS:</text><text x="113" y="250" font-size="11" class="cyan">clear spec</text><text x="275" y="250" font-size="11" class="muted">/</text><text x="295" y="250" font-size="11" class="cyan">readable code</text><text x="490" y="250" font-size="11" class="muted">/</text><text x="510" y="250" font-size="11" class="cyan">test evidence</text><text x="709" y="250" font-size="11" class="muted">/</text><text x="730" y="250" font-size="11" class="cyan">trade-offs</text>
</svg>