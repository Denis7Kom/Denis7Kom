<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-labelledby="t d">
  <title id="t">Security review loop</title>
  <desc id="d">Four repeating steps: boundary, assumption, failure, verify. Status: learning OWASP Top 10 and SQL injection.</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.hl{opacity:0;animation:hl 8s linear infinite}
.flow{animation:flow 2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes hl{0%{opacity:0}2%,25%{opacity:1}27%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes pulse{50%{opacity:.3}}
</style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#141d28" stroke-width="1"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#101a26"/><stop offset="1" stop-color="#0a0e13"/></radialGradient>
    
  </defs>
  <rect x="1" y="1" width="638" height="260" rx="14" fill="url(#vig)" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="638" height="260" rx="14" fill="url(#grid)"/>

  <text class="s" x="30" y="44" font-size="22" font-weight="700" fill="#e6f1ff">Security review loop</text>
<rect x="14" y="64" width="142" height="62" rx="10" fill="#111821" stroke="#3a4d63" stroke-width="1.5"/><rect class="hl" style="animation-delay:0s" x="14" y="64" width="142" height="62" rx="10" fill="none" stroke="#3ddc97" stroke-width="3"/><text class="m" x="85" y="88" font-size="13" fill="#8497ad" text-anchor="middle">01</text><text class="m" x="85" y="112" font-size="16" font-weight="700" fill="#5ad1ff" text-anchor="middle">BOUNDARY</text><rect x="170" y="64" width="142" height="62" rx="10" fill="#111821" stroke="#3a4d63" stroke-width="1.5"/><rect class="hl" style="animation-delay:2s" x="170" y="64" width="142" height="62" rx="10" fill="none" stroke="#3ddc97" stroke-width="3"/><text class="m" x="241" y="88" font-size="13" fill="#8497ad" text-anchor="middle">02</text><text class="m" x="241" y="112" font-size="16" font-weight="700" fill="#5ad1ff" text-anchor="middle">ASSUMPTION</text><rect x="326" y="64" width="142" height="62" rx="10" fill="#111821" stroke="#3a4d63" stroke-width="1.5"/><rect class="hl" style="animation-delay:4s" x="326" y="64" width="142" height="62" rx="10" fill="none" stroke="#3ddc97" stroke-width="3"/><text class="m" x="397" y="88" font-size="13" fill="#8497ad" text-anchor="middle">03</text><text class="m" x="397" y="112" font-size="16" font-weight="700" fill="#5ad1ff" text-anchor="middle">FAILURE</text><rect x="482" y="64" width="142" height="62" rx="10" fill="#111821" stroke="#3a4d63" stroke-width="1.5"/><rect class="hl" style="animation-delay:6s" x="482" y="64" width="142" height="62" rx="10" fill="none" stroke="#3ddc97" stroke-width="3"/><text class="m" x="553" y="88" font-size="13" fill="#8497ad" text-anchor="middle">04</text><text class="m" x="553" y="112" font-size="16" font-weight="700" fill="#5ad1ff" text-anchor="middle">VERIFY</text>
<path d="M164 95l-8-6v12z" fill="#3a4d63" transform="translate(0 0)"/><path d="M320 95l-8-6v12z" fill="#3a4d63" transform="translate(0 0)"/><path d="M476 95l-8-6v12z" fill="#3a4d63" transform="translate(0 0)"/>
  <path class="flow" d="M555 128C555 162 85 162 85 132" fill="none" stroke="#3ddc97" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M85 130l-6 9h12z" fill="#3ddc97" fill-opacity=".8"/>
  <text class="m" x="320" y="180" font-size="14" fill="#8497ad" text-anchor="middle">repeat after every change</text>
  <rect x="14" y="194" width="612" height="42" rx="10" fill="#0d1520" stroke="#243242" stroke-width="1.5"/>
  <circle class="pulse" cx="38" cy="215" r="5" fill="#f5c451"/>
  <text class="m" x="52" y="220" font-size="15" font-weight="700" fill="#f5c451">LEARNING</text>
  <text class="m" x="156" y="220" font-size="15" fill="#e6f1ff">OWASP Top 10 · SQL injection</text>
  <path d="M14 32V14H32 M608 14H626V32 M14 230V248H32 M608 248H626V230" fill="none" stroke="#3ddc97" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
</svg>
