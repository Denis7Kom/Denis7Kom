<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-label="Aviation — Procedural aircraft. Flight systems."><title>Aviation — Procedural aircraft. Flight systems.</title><defs><linearGradient id="bg"><stop stop-color="#121e2d"/><stop offset="1" stop-color="#0d1117"/></linearGradient><linearGradient id="line"><stop stop-color="#35d0ba"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="typing"><rect width="960" height="180" class="type-mask"/></clipPath></defs><style>text{font-family:Consolas,monospace;fill:#e6edf3}.muted{fill:#9dacc1}.accent{fill:#35d0ba}.rise{animation:rise 8s ease-in-out infinite;animation-delay:var(--delay,0s)}.pulse{animation:pulse 4s ease-in-out infinite}.trace{stroke-dasharray:18 230;animation:trace 6s linear infinite}.float{animation:float 5s ease-in-out infinite}.type-mask{animation:type 8s steps(44) infinite}.scan{animation:scan 7s ease-in-out infinite}@keyframes rise{0%,4%{opacity:0;transform:translateY(9px)}15%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}@keyframes pulse{50%{opacity:.4}}@keyframes trace{to{stroke-dashoffset:-496}}@keyframes float{50%{transform:translateY(-4px)}}@keyframes type{0%,3%{width:0px}35%,100%{width:960px}}@keyframes scan{50%{transform:translateX(45px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1}.type-mask{width:960px}}</style><rect x="1" y="1" width="958" height="178" rx="12" fill="url(#bg)" stroke="#2a3c51"/><text x="28" y="28" font-size="11" class="accent">02 / JAVASCRIPT / WEBGL / GEOMETRY</text><g class="rise"><text x="28" y="77" font-size="30" font-weight="700">Aviation</text><text x="29" y="108" font-size="16" class="muted">Procedural aircraft. Flight systems.</text></g><text x="29" y="141" font-size="12" class="muted">Custom rendering + regression checks</text><g transform="translate(800 54)"><g class="float" fill="none" stroke="#35d0ba" stroke-width="2"><path d="M0 0L-22 22 0 44M48 0L70 2