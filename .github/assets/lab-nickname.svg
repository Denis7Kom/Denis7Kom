<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Denis7Kom development lab"><title>Denis7Kom development lab</title><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#263446" fill="none" opacity=".35"/></pattern><linearGradient id="bg"><stop stop-color="#172231"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>text{font-family:Consolas,'Liberation Mono',monospace;fill:#e6edf3}.muted{fill:#91a0b5}.green{fill:#35d0ba}.gold{fill:#f5c451}.blink{animation:blink 1.2s steps(1) infinite}.walk{animation:walk 8s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.packet{stroke-dasharray:12 220;animation:packet 5s linear infinite}@keyframes blink{50%{opacity:0}}@keyframes walk{0%{transform:translateX(0)}50%{transform:translateX(70px)}100%{transform:translateX(0)}}@keyframes pulse{50%{opacity:.35}}@keyframes packet{to{stroke-dashoffset:-464}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.nickname-letter{opacity:0;animation:letter-rise 7s cubic-bezier(.2,.8,.2,1) infinite}@keyframes letter-rise{0%{opacity:0;transform:translateY(22px)}12%,82%{opacity:1;transform:translateY(0)}94%,100%{opacity:0;transform:translateY(-9px)}}@media(prefers-reduced-motion:reduce){.nickname-letter{opacity:1;transform:none;animation:none!important}}</style><rect width="960" height="260" rx="14" fill="url(#bg)"/><rect width="960" height="260" rx="14" fill="url(#grid)"/><rect x="34" y="30" width="892" height="200" rx="9" fill="#0d1117" stroke="#39475b" stroke-width="2"/><circle cx="58" cy="54" r="5" fill="#ff6b6b"/><circle cx="77" cy="54" r="5" fill="#f5c451"/><circle cx="96" cy="54" r="5" fill="#35d0ba"/><text x="121" y="59" font-size="11" class="muted">Denis7Kom@software-security-lab</text><text x="67" y="109" font-size="17" class="green">$ whoami</text><g aria-label="Denis7Kom"><text x="67" y="149" font-size="44" font-weight="700" c