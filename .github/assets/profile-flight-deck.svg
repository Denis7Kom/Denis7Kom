<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Denis7Kom — engineering flight deck</title><desc id="desc">A developer profile header inspired by an aircraft instrument panel, with softly animated navigation and signal graphics.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142633"/><stop offset="1" stop-color="#080e18"/></linearGradient>
<linearGradient id="bar"><stop stop-color="#45e2ca"/><stop offset="1" stop-color="#9681ff"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#b5d6e0" opacity=".055"/></pattern>
</defs>
<style>
text{font-family:Consolas,'Liberation Mono',monospace;fill:#edf6f7}.muted{fill:#a1b8c6}.teal{fill:#57dfcf}.gold{fill:#f6cf7b}.tiny{font-size:12px;letter-spacing:1.4px}.sweep{transform-origin:585px 181px;animation:sweep 12s linear infinite}.blink{animation:blink 1.4s steps(1) infinite}.scan{stroke-dasharray:18 250;animation:scan 5s linear infinite}.glow{animation:glow 5s ease-in-out infinite}@keyframes sweep{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.12}}@keyframes scan{to{stroke-dashoffset:-268}}@keyframes glow{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.sweep,.blink,.scan,.glow{animation:none}}
</style>
<rect x="1" y="1" width="758" height="358" rx="18" fill="url(#bg)" stroke="#3b5564"/><rect x="2" y="2" width="756" height="356" rx="18" fill="url(#grid)"/>
<path d="M22 48H738" stroke="#344c5a"/><circle cx="28" cy="25" r="4" fill="#55dfca"/><text x="41" y="30" class="muted tiny">ENGINEERING FLIGHT DECK</text><text x="730" y="30" text-anchor="end" class="gold tiny">BUILD / EXPLORE / VERIFY</text>
<text x="38" y="91" class="teal tiny">DEVELOPER PROFILE</text>
<text x="34" y="155" font-size="56" font-weight="700" letter-spacing="-2">Denis7Kom</text><rect x="38" y="173" width="300" height="3" rx="1.5" fill="url(#bar)"/><circle cx="345" cy="174.5" r="3" fill="#5ce6d2" class="glow"/>
<text x="38" y="215" font-size="19" class="muted">Software &amp; interactive systems</text><text x="38" y="245" font-size="19" class="muted">Learning application security</text>
<rect x="38" y="277" width="318" height="38" rx="6" fill="#122b32" stroke="#31575e"/><circle cx="54" cy="296" r="4" fill="#4ee2c9" class="blink"/><text x="68" y="302" font-size="14" class="teal">LEARN  /  BUILD  /  TEST</text>
<g fill="none"><circle cx="585" cy="181" r="111" stroke="#344f5b" stroke-width="2"/><circle cx="585" cy="181" r="95" stroke="#547481" stroke-dasharray="2 8" stroke-width="2"/><circle cx="585" cy="181" r="73" stroke="#375764"/><path d="M474 181H696M585 70V292" stroke="#34505a"/><path d="M504 181H666" stroke="#55e5ce" stroke-width="2" class="scan"/><g class="sweep"><path d="M585 181L585 76" stroke="#5ce6d2" stroke-width="2"/><circle cx="585" cy="76" r="4" fill="#5ce6d2"/></g><path d="M542 181h27l16-9 16 9h27M585 172v18" stroke="#f6cf7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="585" y="60" text-anchor="middle" class="gold tiny">N</text><text x="585" y="319" text-anchor="middle" class="muted tiny">IDEA → CODE → EVIDENCE</text>
<path d="M38 336H722" stroke="#344c5a"/><text x="38" y="352" class="muted tiny">SOFTWARE · SECURITY · CURIOSITY</text><text x="722" y="352" text-anchor="end" class="teal tiny">DENIS7KOM</text>
</svg>