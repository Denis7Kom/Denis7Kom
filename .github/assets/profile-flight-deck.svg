<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Denis7Kom — engineering flight deck</title><desc id="desc">A developer profile header inspired by an aircraft instrument panel, with softly animated navigation and signal graphics.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142633"/><stop offset="1" stop-color="#080e18"/></linearGradient>
<linearGradient id="bar"><stop stop-color="#45e2ca"/><stop offset="1" stop-color="#9681ff"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#b5d6e0" opacity=".055"/></pattern>
<radialGradient id="radarbg"><stop stop-color="#142f39"/><stop offset="1" stop-color="#09141e"/></radialGradient><linearGradient id="sector" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ee4c7" stop-opacity=".34"/><stop offset="1" stop-color="#4ee4c7" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:Consolas,'Liberation Mono',monospace;fill:#edf6f7}.muted{fill:#a1b8c6}.teal{fill:#57dfcf}.gold{fill:#f6cf7b}.tiny{font-size:12px;letter-spacing:1.4px}.sweep{transform-origin:585px 181px;animation:sweep 12s linear infinite}.contact{animation:contact 3s ease-in-out infinite}.contact2{animation-delay:-1s}.contact3{animation-delay:-2s}.blink{animation:blink 2s 2.4s ease-in-out 2}.scan{stroke-dasharray:18 250;animation:scan 2s 1.5s linear 1 both}.glow{animation:glow 1.2s ease-in-out 2}.focus{animation:focus 1s .8s ease-out both}.navcue{animation:navcue 1.1s 2.8s ease-out both}@keyframes focus{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes navcue{from{opacity:.2}to{opacity:1}}@keyframes contact{0%,100%{opacity:.45}50%{opacity:1}}@keyframes sweep{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.12}}@keyframes scan{to{stroke-dashoffset:-268}}@keyframes glow{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.sweep,.contact,.blink,.scan,.glow,.focus,.navcue{animation:none}}
</style>
<rect x="1" y="1" width="758" height="358" rx="18" fill="url(#bg)" stroke="#3b5564"/><rect x="2" y="2" width="756" height="356" rx="18" fill="url(#grid)"/>
<path d="M22 48H738" stroke="#344c5a"/><circle cx="28" cy="25" r="4" fill="#55dfca"/><text x="41" y="30" class="muted tiny">ENGINEERING FLIGHT DECK</text><text x="730" y="30" text-anchor="end" class="gold tiny">BUILD / EXPLORE / VERIFY</text>
<text x="38" y="91" class="teal tiny">DEVELOPER PROFILE</text>
<text x="34" y="155" font-size="56" font-weight="700" letter-spacing="-2">Denis7Kom</text><rect x="38" y="173" width="300" height="3" rx="1.5" fill="url(#bar)"/><circle cx="345" cy="174.5" r="3" fill="#5ce6d2" class="glow"/>
<text class="focus muted" x="38" y="215" font-size="19">Software &amp; interactive systems</text><text class="focus muted" x="38" y="245" font-size="19">Learning application security</text>
<rect x="38" y="277" width="318" height="38" rx="6" fill="#122b32" stroke="#31575e"/><circle cx="54" cy="296" r="4" fill="#4ee2c9" class="blink"/><text x="68" y="302" font-size="14" class="teal">LEARN  /  BUILD  /  TEST</text>
<g aria-label="Decorative radar">
<circle cx="585" cy="181" r="117" fill="#0a1721" stroke="#496a75" stroke-width="2"/>
<circle cx="585" cy="181" r="107" fill="url(#radarbg)" stroke="#2d5860" stroke-width="1.5"/>
<g fill="none" stroke="#4a7980" stroke-opacity=".6"><circle cx="585" cy="181" r="80"/><circle cx="585" cy="181" r="53"/><circle cx="585" cy="181" r="27"/><path d="M478 181h214M585 74v214M509 105l152 152M661 105 509 257" stroke-opacity=".45"/></g>
<circle cx="585" cy="181" r="113" fill="none" stroke="#8db7b4" stroke-width="3" stroke-dasharray="2 8" opacity=".65"/>
<g class="sweep"><path d="M585 181 L585 74 A107 107 0 0 1 660.7 105.3 Z" fill="url(#sector)"/><path d="M585 181V74" stroke="#74f4dc" stroke-width="2"/><circle cx="585" cy="74" r="3" fill="#b5ffed"/></g>
<g fill="#74f4dc"><g class="contact"><circle cx="540" cy="139" r="3.5"/><circle cx="540" cy="139" r="8" fill="none" stroke="#74f4dc" opacity=".5"/></g><g class="contact contact2"><circle cx="641" cy="160" r="3.5"/><circle cx="641" cy="160" r="8" fill="none" stroke="#74f4dc" opacity=".5"/></g><g class="contact contact3"><circle cx="614" cy="232" r="3.5"/><circle cx="614" cy="232" r="8" fill="none" stroke="#74f4dc" opacity=".5"/></g></g>
<path d="M567 185h12l6-12 6 12h12M585 173v24" fill="none" stroke="#f6cf7b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="585" y="61" text-anchor="middle" class="gold tiny">N</text><text x="585" y="302" text-anchor="middle" class="muted tiny">S</text><text x="464" y="185" text-anchor="middle" class="muted tiny">W</text><text x="706" y="185" text-anchor="middle" class="muted tiny">E</text>
</g>
<text x="585" y="319" text-anchor="middle" class="teal tiny navcue">EXPLORE BELOW ↓</text>
<path d="M38 336H722" stroke="#344c5a"/><text x="38" y="352" class="muted tiny">SOFTWARE · SECURITY · CURIOSITY</text><text x="722" y="352" text-anchor="end" class="teal tiny">DENIS7KOM</text>
</svg>