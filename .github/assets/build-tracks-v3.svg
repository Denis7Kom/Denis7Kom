<svg xmlns="http://www.w3.org/2000/svg" width="960" height="242" viewBox="0 0 960 242" role="img" aria-labelledby="t d"><title id="t">What I Build — three engineering tracks</title><desc id="d">Animated software applications, interactive systems and security engineering panels. Expand the sections below this graphic for details.</desc>
