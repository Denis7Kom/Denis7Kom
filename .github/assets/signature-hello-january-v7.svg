  <style>
 .pen-stroke,.flourish { stroke-dasharray:1; stroke-dashoffset:0 }
 .signature-dot { transform-box:fill-box; transform-origin:center }
 @keyframes write { from { stroke-dashoffset:1 } to { stroke-dashoffset:0 } }
 @keyframes cursor { 0%,49% { opacity:1 } 50%,100% { opacity:.15 } }
 @keyframes settle { from { opacity:1 } to { opacity:1 } }
 @keyframes dot { 0% {opacity:0;transform:scale(.25)} 70% {opacity:1;transform:scale(1.15)} 100% {opacity:1;transform:scale(1)} }
 @media(prefers-reduced-motion:no-preference) {
  .pen-stroke { animation:write var(--duration) cubic-bezier(.3,.08,.65,.95) var(--delay) both }
  .flourish { animation:write .65s cubic-bezier(.12,.5,.3,1) 8.06s both }
  .signature-dot { animation:dot .22s ease-out 8.91s both }
  .terminal-cursor { animation:cursor .65s step-end 0s 15,settle .01s linear 9.13s forwards }
 }
 </style>
