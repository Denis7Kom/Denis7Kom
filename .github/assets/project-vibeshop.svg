  <text class="m" x="36" y="302" font-size="11" letter-spacing="1.5" fill="#7a8ba0">CUSTOMER JOURNEY</text>
<rect x="36" y="318" width="118" height="30" rx="8" fill="#111821" stroke="#3a4d63"/><text class="m" x="95" y="338" font-size="12" font-weight="700" fill="#e6f1ff" text-anchor="middle">DISCOVER</text><rect class="hl" style="animation-delay:0s" x="36" y="318" width="118" height="30" rx="8" fill="none" stroke="#3ddc97" stroke-width="2.5"/><path d="M160 326l8 7l-8 7z" fill="#3a4d63"/><rect x="176" y="318" width="118" height="30" rx="8" fill="#111821" stroke="#3a4d63"/><text class="m" x="235" y="338" font-size="12" font-weight="700" fill="#e6f1ff" text-anchor="middle">PRODUCT</text><rect class="hl" style="animation-delay:2s" x="176" y="318" width="118" height="30" rx="8" fill="none" stroke="#3ddc97" stroke-width="2.5"/><path d="M300 326l8 7l-8 7z" fill="#3a4d63"/><rect x="316" y="318" width="118" height="30" rx="8" fill="#111821" stroke="#3a4d63"/><text class="m" x="375" y="338" font-size="12" font-weight="700" fill="#e6f1ff" text-anchor="middle">CART</text><rect class="hl" style="animation-delay:4s" x="316" y="318" width="118" height="30" rx="8" fill="none" stroke="#3ddc97" stroke-width="2.5"/><path d="M440 326l8 7l-8 7z" fill="#3a4d63"/><rect x="456" y="318" width="118" height="30" rx="8" fill="#111821" stroke="#3a4d63"/><text class="m" x="515" y="338" font-size="12" font-weight="700" fill="#e6f1ff" text-anchor="middle">CHECKOUT</text><rect class="hl" style="animation-delay:6s" x="456" y="318" width="118" height="30" rx="8" fill="none" stroke="#3ddc97" stroke-width="2.5"/><path d="M580 326l8 7l-8 7z" fill="#3a4d63"/><rect x="596" y="318" width="118" height="30" rx="8" fill="#111821" stroke="#3a4d63"/><text class="m" x="655" y="338" font-size="12" font-weight="700" fill="#e6f1ff" text-anchor="middle">ORDERS</text><rect class="hl" style="animation-delay:8s" x="596" y="318" width="118" height="30" rx="8" fill="none" stroke="#3ddc97" stroke-width="2.5"/>
  <text class="m" x="36" y="392" font-size="12.5" fill="#9fb3c8">Stack: Java · JSP · Servlets · DAO · MySQL · HTML/CSS</text>
  <text class="m" x="36" y="414" font-size="12.5" fill="#7a8ba0">Access filters exist in the source; object-level authorisation has not been independently audited.</text>
