<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
  <title id="t">VibeShop architecture</title>
  <desc id="d">A request travels from JSP pages through servlets and DAO classes to the MySQL database and back, with access filters guarding the servlets. Below, the customer journey: discover, product, cart, checkout, orders.</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.req{animation:req 7s linear infinite}
.res{animation:res 7s linear infinite 3.5s}
.glow{animation:glow 5s ease-in-out infinite}
.hl{opacity:0;animation:hl 10s linear infinite}
@keyframes req{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(682px);opacity:0}}
@keyframes res{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(-682px);opacity:0}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes hl{0%{opacity:0}3%,18%{opacity:1}22%,100%{opacity:0}}
</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141d28" stroke-width="1"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#101a26"/><stop offset="1" stop-color="#0a0e13"/></radialGradient>
    <clipPath id="card"><rect x="2" y="2" width="896" height="436" rx="13"/></clipPath>
    
  </defs>
  <rect x="1" y="1" width="898" height="438" rx="14" fill="url(#vig)" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="438" rx="14" fill="url(#grid)"/>

  <text class="s" x="36" y="50" font-size="24" font-weight="700" fill="#e6f1ff">VibeShop · Turbo Layout</text>
  <text class="m" x="36" y="76" font-size="13.5" fill="#9fb3c8">Java web app for live-music commerce · University of Salerno team project · I was team lead</text>
  <rect x="716" y="30" width="148" height="28" rx="14" fill="#0f1a16" stroke="#3ddc97"/>
  <text class="m" x="790" y="49" font-size="12" font-weight="700" fill="#3ddc97" text-anchor="middle">COMPLETED</text>

  <rect class="glow" x="226" y="100" width="234" height="28" rx="14" fill="#0f1a16" stroke="#3ddc97" stroke-dasharray="4 4"/>
  <text class="m" x="343" y="119" font-size="12" fill="#3ddc97" text-anchor="middle">AuthFilter · AdminFilter</text>
  <path d="M343 128V150" stroke="#3ddc97" stroke-dasharray="3 3"/>

