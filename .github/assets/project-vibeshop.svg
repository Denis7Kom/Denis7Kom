<rect x="36" y="150" width="150" height="90" rx="10" fill="#111821" stroke="#5ad1ff" stroke-width="1.5"/><text class="m" x="111.0" y="182" font-size="15" font-weight="700" fill="#5ad1ff" text-anchor="middle">JSP pages</text><text class="m" x="111.0" y="205" font-size="11.5" fill="#9fb3c8" text-anchor="middle">catalogue · cart</text><text class="m" x="111.0" y="221" font-size="11.5" fill="#9fb3c8" text-anchor="middle">checkout · orders</text><text class="m" x="111.0" y="260" font-size="10.5" fill="#7a8ba0" text-anchor="middle">webapp/jsp</text><rect x="258" y="150" width="170" height="90" rx="10" fill="#111821" stroke="#3ddc97" stroke-width="1.5"/><text class="m" x="343.0" y="182" font-size="15" font-weight="700" fill="#3ddc97" text-anchor="middle">Servlets</text><text class="m" x="343.0" y="205" font-size="11.5" fill="#9fb3c8" text-anchor="middle">Cart · Checkout</text><text class="m" x="343.0" y="221" font-size="11.5" fill="#9fb3c8" text-anchor="middle">Login · Search</text><text class="m" x="343.0" y="260" font-size="10.5" fill="#7a8ba0" text-anchor="middle">com/turbolayout</text><rect x="500" y="150" width="150" height="90" rx="10" fill="#111821" stroke="#f5c451" stroke-width="1.5"/><text class="m" x="575.0" y="182" font-size="15" font-weight="700" fill="#f5c451" text-anchor="middle">DAO</text><text class="m" x="575.0" y="205" font-size="11.5" fill="#9fb3c8" text-anchor="middle">user · artist · concert</text><text class="m" x="575.0" y="221" font-size="11.5" fill="#9fb3c8" text-anchor="middle">product · order</text><text class="m" x="575.0" y="260" font-size="10.5" fill="#7a8ba0" text-anchor="middle">model/dao</text><rect x="722" y="150" width="142" height="90" rx="10" fill="#111821" stroke="#b79cff" stroke-width="1.5"/><text class="m" x="793.0" y="182" font-size="15" font-weight="700" fill="#b79cff" text-anchor="middle">MySQL</text><text class="m" x="793.0" y="205" font-size="11.5" fill="#9fb3c8" text-anchor="middle">relational schema</text><text class="m" x="793.0" y="221" font-size="11.5" fill="#9fb3c8" text-anchor="middle"></text><text class="m" x="793.0" y="260" font-size="10.5" fill="#7a8ba0" text-anchor="middle">db/VIBESHOP_FINAL.sql</text>
