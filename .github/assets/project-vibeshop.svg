<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" role="img" aria-labelledby="t d">
  <title id="t">VibeShop: architecture and customer journey</title>
  <desc id="d">Pages (JSP) call servlets guarded by access filters, which use DAO classes to reach the MySQL database. Customer journey: discover, product, cart, checkout, orders. Status: completed.</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.req{animation:req 5s linear infinite}
.glow{animation:glow 5s ease-in-out infinite}
.hl{opacity:0;animation:hl 10s linear infinite}
@keyframes req{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(478px);opacity:0}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes hl{0%{opacity:0}3%,18%{opacity:1}22%,100%{opacity:0}}
</style>
