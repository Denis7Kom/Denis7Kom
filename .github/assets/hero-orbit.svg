<svg xmlns="http://www.w3.org/2000/svg" width="960" height="354" viewBox="0 0 960 354" role="img" aria-labelledby="title desc"><title id="title">Denis Komarov — code, cybersecurity, visual projects and aviation</title><desc id="desc">Animated orbital grid, travelling light and radar. Decorative motion; no live status data.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25394f" stroke-opacity=".35" stroke-width=".6"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b31"/><stop offset="1" stop-color="#090e1a"/></linearGradient><radialGradient id="halo"><stop stop-color="#6954ce" stop-opacity=".24"/><stop offset="1" stop-color="#6954ce" stop-opacity="0"/></radialGradient><linearGradient id="line"><stop stop-color="#67e8f9"/><stop offset=".55" stop-color="#a899ff"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><clipPath id="bounds"><rect x="1" y="1" width="958" height="352" rx="22"/></clipPath></defs><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,"Liberation Mono",monospace} .muted{fill:#99adc7} .bright{fill:#eef5ff} .cyan{fill:#67e8f9} .purple{fill:#b4a0ff}.orbit{transform-origin:758px 177px;animation:orbit 38s linear infinite}.counter{transform-origin:758px 177px;animation:orbit 54s linear infinite reverse}.dash{animation:flow 9s linear infinite}.beacon{animation:beacon 3.8s ease-in-out infinite}.sweep{animation:sweep 8s ease-in-out infinite;opacity:.4}.cursor{animation:blink 1.6s steps(1) infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-192}}@keyframes beacon{50%{opacity:.35}}@keyframes sweep{0%,100%{transform:translateX(-160px)}50%{transform:translateX(150px)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".75" y=".75" width="958.5" height="352.5" rx="22" fill="#09111f" stroke="#25344a" stroke-width="1.5"/><g clip-path="url(#bounds)"><rect x="1" y="1" width="958" height="352" rx="22" fill="url(#bg)"/><rect width="960" height="354" fill="url(#grid)"/><ellipse cx="770" cy="175" rx="290" ry="240" fill="url(#halo)"/><path d="M32 1H928" stroke="url(#line)" stroke-width="2"/><path d="M48 48H205M48 48V65" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
