<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 301" role="img" aria-labelledby="title">
  <title id="title">Application security</title>
  <defs>
    <linearGradient id="panel" x2="100%" y2="100%"><stop stop-color="#060a0c"/><stop offset="1" stop-color="#102529"/></linearGradient>
    <radialGradient id="glow" cx=".86" cy=".28" r=".59"><stop stop-color="#126958" stop-opacity=".64"/><stop offset="1" stop-color="#126958" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#77d8c8" stroke-opacity=".11"/></pattern>
    <clipPath id="clip"><path d="M19 1H661L679 19V282L661 300H19L1 282V19Z"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="680" height="301" fill="url(#panel)"/>
    <rect width="680" height="301" fill="url(#glow)"/>
    <rect x="288" width="392" height="301" fill="url(#grid)"/>
  </g>
  <path d="M19 1H661L679 19V282L661 300H19L1 282V19Z" fill="none" stroke="#325751"/>
  <path d="M24 1h106m420 299h105" stroke="#71dbc7" stroke-opacity=".72" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="33" y="57" font-size="36" font-weight="650" fill="#f3faf8" text-anchor="start" letter-spacing="-0.6">Application security</text>
    <g transform="translate(610 23) scale(0.9)" fill="none" stroke="#9ff6e2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="27" stroke="#5cd2b9" stroke-opacity=".38"/><circle cx="18" cy="18" r="32" stroke="#74dec8" stroke-opacity=".25" stroke-dasharray="2 4"/><path d="M18 3l13 5v9c0 8-6 13-13 17C11 30 5 25 5 17V8z"/><path d="m12 17 4 4 8-8"/></g>
    <path d="M34 79H646" stroke="#41635e" stroke-opacity=".72"/>
    <text x="34" y="114" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">I’m studying the OWASP Top 10 and SQL injection.</text>
    <text x="34" y="146" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">When reviewing my own code, I check whether the server</text>
    <text x="34" y="178" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">verifies that the signed-in user owns the order they open.</text>
    <text x="34" y="228" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">I also follow Cisco cybersecurity events and 404 Media’s</text>
    <text x="34" y="260" font-size="23" font-weight="450" fill="#c4d8d4" text-anchor="start">security coverage.</text>
  </g>
</svg>
