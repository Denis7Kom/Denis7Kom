<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">whoami terminal</title>
  <desc id="d">Terminal window listing the handle den7best, role, focus, languages and work status.</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.l{animation:show .3s backwards}
.blink{animation:blink 1.1s steps(1) infinite}
.band{animation:band 6s linear infinite}
@keyframes show{from{opacity:0;transform:translateY(4px)}}
@keyframes blink{50%{opacity:0}}
@keyframes band{from{transform:translateY(-60px)}to{transform:translateY(420px)}}
</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141d28" stroke-width="1"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#101a26"/><stop offset="1" stop-color="#0a0e13"/></radialGradient>
    <clipPath id="card"><rect x="2" y="2" width="896" height="396" rx="13"/></clipPath>
    
    <pattern id="scl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".035"/></pattern>
    <linearGradient id="bandg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ddc97" stop-opacity="0"/><stop offset=".5" stop-color="#3ddc97" stop-opacity=".07"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></linearGradient>
    <clipPath id="tb"><rect x="2" y="40" width="896" height="358"/></clipPath>

  </defs>
  <rect x="1" y="1" width="898" height="398" rx="14" fill="url(#vig)" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="398" rx="14" fill="url(#grid)"/>

  <rect x="2" y="2" width="896" height="38" rx="13" fill="#111821"/>
  <rect x="2" y="24" width="896" height="16" fill="#111821"/>
  <path d="M2 40H898" stroke="#243242"/>
  <circle cx="28" cy="21" r="6" fill="#ff6b6b"/><circle cx="50" cy="21" r="6" fill="#f5c451"/><circle cx="72" cy="21" r="6" fill="#3ddc97"/>
  <text class="m" x="450.0" y="26" font-size="13" fill="#7a8ba0" text-anchor="middle">den7best@naples: ~</text>
  <text class="m" x="866" y="26" font-size="12" fill="#7a8ba0" text-anchor="end">zsh</text>
  <g class="m" font-size="16">
<g class="l" style="animation-delay:0.4s"><text x="32" y="84" fill="#3ddc97">$ <tspan fill="#e6f1ff">whoami</tspan></text><text x="48" y="108" fill="#5ad1ff">den7best</text></g>
<g class="l" style="animation-delay:1.3s"><text x="32" y="142" fill="#3ddc97">$ <tspan fill="#e6f1ff">cat role.txt</tspan></text><text x="48" y="166" fill="#9fb3c8">Computer Science student (L-31), University of Salerno</text></g>
<g class="l" style="animation-delay:2.2s"><text x="32" y="200" fill="#3ddc97">$ <tspan fill="#e6f1ff">cat focus.txt</tspan></text><text x="48" y="224" fill="#9fb3c8">Java web apps · SQL · access control · OWASP Top 10 (learning)</text></g>
<g class="l" style="animation-delay:3.1s"><text x="32" y="258" fill="#3ddc97">$ <tspan fill="#e6f1ff">cat languages.txt</tspan></text><text x="48" y="282" fill="#9fb3c8">Russian (native) · Italian B2 · English B2 · German A2</text></g>
<g class="l" style="animation-delay:4.0s"><text x="32" y="316" fill="#3ddc97">$ <tspan fill="#e6f1ff">cat status.txt</tspan></text><text x="48" y="340" fill="#f5c451">open to work · Naples, Italy</text></g>
<g class="l" style="animation-delay:4.9s"><text x="32" y="374" fill="#3ddc97">$ <tspan class="blink">▌</tspan></text></g>
  </g>
  <g clip-path="url(#tb)"><rect x="2" y="40" width="896" height="358" fill="url(#scl)"/><rect class="band" x="2" y="40" width="896" height="60" fill="url(#bandg)"/></g>
  <path d="M16 36V16H36 M864 16H884V36 M16 364V384H36 M864 384H884V364" fill="none" stroke="#3ddc97" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
</svg>
