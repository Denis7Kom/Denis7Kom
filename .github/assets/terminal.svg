<svg xmlns="http://www.w3.org/2000/svg" width="960" height="184" viewBox="0 0 960 184" role="img" aria-labelledby="title desc"><title id="title">Developer terminal</title><desc id="desc">Programmer, cybersecurity learner, web and visual projects. Animated command reveal and cursor.</desc><defs><clipPath id="reveal"><rect class="reveal" x="32" y="47" width="850" height="31"/></clipPath></defs><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,"Liberation Mono",monospace} .muted{fill:#99adc7} .bright{fill:#eef5ff} .cyan{fill:#67e8f9} .purple{fill:#b4a0ff}.reveal{animation:typing 10s steps(30,end) infinite}.cursor{animation:blink 1.2s steps(1) infinite}.packet{animation:packet 5s linear infinite}@keyframes typing{0%{width:0}26%,95%{width:850px}100%{width:0}}@keyframes blink{50%{opacity:0}}@keyframes packet{from{stroke-dashoffset:90}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".75" y=".75" width="958.5" height="182.5" rx="22" fill="#09111f" stroke="#25344a" stroke-width="1.5"/><path d="M1 37H959" stroke="#25344a"/><circle cx="23" cy="20" r="4" fill="#f08092"/><circle cx="39" cy="20" r="4" fill="#f2cc78"/><circle cx="55" cy="20" r="4" fill="#75d9bc"/><text x="393" y="24" font-size="12" fill="#91a8c4" class="mono">denis@github: ~</text>
<g clip-path="url(#reveal)"><text x="30" y="70" font-size="18" fill="#67e8f9" class="mono">❯</text><text x="53" y="70" font-size="16" fill="#e5efff" class="mono">whoami</text></g>
<text x="30" y="101" font-size="16" fill="#b6c8dd" class="mono">Programmer. Cybersecurity learner. Visual creator.</text>
<text x="30" y="137" font-size="18" fill="#67e8f9" class="mono">❯</text><text x="53" y="137" font-size="16" fill="#b5a3ff" class="mono">build → test → refine</text><rect class="cursor" x="282" y="123" width="9" height="19" fill="#67e8f9"/>
<path class="packet" d="M726 108H751L762 85 777 128 791 99H817L830 108H925" stroke="#67e8f9" fill="none" stroke-width="1.5" stroke-dasharray="6 3" opacity=".65"/>
<text x="744" y="157" font-size="10" fill="#91a8c4" class="mono">CODE / VISUAL / FLIGHT</text></svg>
