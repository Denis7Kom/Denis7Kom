<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Denis7Kom — software and security lab</title><desc id="desc">Animated developer dashboard with a moving signal and the cycle build, explore, verify.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f2b"/><stop offset="1" stop-color="#090e17"/></linearGradient><linearGradient id="accent"><stop stop-color="#35d0ba"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8aacc4" opacity=".08"/></pattern></defs>
<style>text{font-family:Consolas,'Liberation Mono',monospace;fill:#e6edf3}.muted{fill:#91a8b9}.accent{fill:#48e1c9}.small{font-size:13px;letter-spacing:2px}.pulse{animation:pulse 3s ease-in-out infinite}.orbit{transform-origin:920px 195px;animation:spin 24s linear infinite}.reverse{transform-origin:920px 195px;animation:spin 18s linear infinite reverse}.signal{stroke-dasharray:12 260;animation:flow 4s linear infinite}.cursor{animation:pulse 1s steps(1) infinite}.state{animation:states 9s infinite}.s2{animation-delay:-6s}.s3{animation-delay:-3s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-272}}@keyframes pulse{50%{opacity:.25}}@keyframes states{0%,29%{opacity:1}34%,95%{opacity:0}100%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.s2,.s3{opacity:0}}</style>
<rect x="1" y="1" width="1198" height="388" rx="20" fill="url(#bg)" stroke="#31485a"/><rect x="2" y="2" width="1196" height="386" rx="20" fill="url(#grid)"/>
<path d="M32 60H1168" stroke="#304451"/><circle cx="38" cy="32" r="5" fill="#ff6b6b"/><circle cx="57" cy="32" r="5" fill="#f5c451"/><circle cx="76" cy="32" r="5" fill="#35d0ba"/><text x="105" y="37" class="muted small">DENIS7KOM / SOFTWARE SECURITY LAB</text><text x="1040" y="37" class="accent small">● ONLINE</text>
<text x="64" y="112" class="accent small">01 / BUILD · EXPLORE · VERIFY</text><text x="60" y="185" font-size="66" font-weight="700" letter-spacing="-2">Denis7Kom<tspan class="cursor" fill="#35d0ba">_</tspan></text><rect x="64" y="205" width="350" height="3" rx="2" fill="url(#accent)"/>
<text x="64" y="246" font-size="20" class="muted">Software, interactive systems</text><text x="64" y="275" font-size="20" class="muted">and application security.</text>
<rect x="64" y="308" width="490" height="38" rx="7" fill="#142832" stroke="#294e55"/><text x="80" y="333" font-size="14" class="accent">$</text><g font-size="14"><text x="105" y="333" class="state">build --from-ideas</text><text x="105" y="333" class="state s2">explore --systems</text><text x="105" y="333" class="state s3">verify --assumptions</text></g>
<g fill="none"><circle cx="920" cy="195" r="129" stroke="#273c4c"/><circle cx="920" cy="195" r="103" stroke="#32515c" stroke-dasharray="4 8"/><circle cx="920" cy="195" r="75" stroke="#284954"/><g class="orbit"><path d="M920 66A129 129 0 0 1 1049 195" stroke="#35d0ba" stroke-width="3"/><circle cx="920" cy="66" r="5" fill="#35d0ba"/></g><g class="reverse"><path d="M920 92A103 103 0 0 1 1023 195" stroke="#8b5cf6" stroke-width="3"/><circle cx="920" cy="92" r="4" fill="#a78bfa"/></g><path d="M808 195H1032" stroke="#36535e"/><path d="M808 195H1032" stroke="#43e0c8" stroke-width="3" class="signal"/><path d="M920 83V307" stroke="#36535e"/></g>
<circle cx="920" cy="195" r="49" fill="#112830" stroke="#35d0ba" stroke-width="2" class="pulse"/><text x="920" y="203" text-anchor="middle" font-size="25" font-weight="700">&lt;/&gt;</text><text x="920" y="355" text-anchor="middle" class="muted small">IDEA → CODE → EVIDENCE</text>
</svg>