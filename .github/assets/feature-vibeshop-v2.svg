<svg xmlns="http://www.w3.org/2000/svg" width="960" height="318" viewBox="0 0 960 318" role="img" aria-labelledby="title description">
<title id="title">VibeShop — Turbo Layout</title>
<desc id="description">An animated live-music marketplace concept: storefront interface, concert stage, artist and merchandise tiles. University of Salerno team project. Click to open the repository.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a2b"/><stop offset=".58" stop-color="#17192e"/><stop offset="1" stop-color="#22172f"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182943"/><stop offset="1" stop-color="#111b2d"/></linearGradient>
  <linearGradient id="show" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#552b77"/><stop offset=".46" stop-color="#253f71"/><stop offset="1" stop-color="#122337"/></linearGradient>
  <linearGradient id="beamA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cb86ff" stop-opacity=".34"/><stop offset="1" stop-color="#cb86ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="beamB" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#49d8f0" stop-opacity=".28"/><stop offset="1" stop-color="#49d8f0" stop-opacity="0"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9a79ef"/><stop offset="1" stop-color="#51d7e7"/></linearGradient>
  <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4bdff"/><stop offset="1" stop-color="#9c83e7"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#7663d4" stop-opacity=".24"/><stop offset="1" stop-color="#7663d4" stop-opacity="0"/></radialGradient>
  <clipPath id="scene"><rect x="617" y="83" width="294" height="101" rx="11"/></clipPath>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .spot{animation:spot 7s ease-in-out infinite alternate;transform-origin:760px 147px}
  .spot2{animation:spot2 8s ease-in-out infinite alternate;transform-origin:760px 147px}
  .equal{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.65s ease-in-out infinite}
  .dot{animation:blink 2.8s ease-in-out infinite}
  .scan{animation:scan 6s linear infinite}
  @keyframes spot{from{transform:rotate(-5deg);opacity:.55}to{transform:rotate(7deg);opacity:1}}
  @keyframes spot2{from{transform:rotate(8deg);opacity:.45}to{transform:rotate(-7deg);opacity:.9}}
  @keyframes eq{0%,100%{transform:scaleY(.36);opacity:.65}50%{transform:scaleY(1);opacity:1}}
  @keyframes blink{50%{opacity:.28}}
  @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(300px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
