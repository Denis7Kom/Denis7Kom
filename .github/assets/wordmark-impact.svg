    <path d="M780 0q-65 82 91 135t180 95"/>
    <path d="M799 0q-65 85 91 140t180 95"/>
  </g>
  <g transform="translate(54 18) scale(.45)" fill="none" stroke-linecap="round" stroke-linejoin="round">
