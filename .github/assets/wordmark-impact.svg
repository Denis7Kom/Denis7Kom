<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">Denis7Kom</title>
  <desc id="desc">A custom wordmark drops onto a ruled baseline. A teal full stop lands last. A terminal emblem sits in the upper left.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2=".3"><stop stop-color="#172438"/><stop offset="1" stop-color="#0b1019"/></linearGradient>
    <pattern id="ticks" width="20" height="9" patternUnits="userSpaceOnUse"><path d="M1 0v6" stroke="#60758f" opacity=".55"/></pattern>
  </defs>
  <style>
    @keyframes drop {
      0% { opacity:0; transform:translateY(-88px) }
      20% { opacity:1; transform:translateY(-85px) }
      65% { transform:translateY(-72px); animation-timing-function:cubic-bezier(.66,0,1,.55) }
      94% { transform:translateY(0) scaleY(1) }
      96% { transform:translateY(0) scaleY(.965) }
      100% { transform:translateY(0) scaleY(1) }
    }
    @keyframes stamp {
      0% { opacity:0; transform:translateY(-115px) }
      30% { opacity:1; transform:translateY(-110px); animation-timing-function:cubic-bezier(.7,0,1,.5) }
      100% { transform:translateY(0) }
    }
    @keyframes impact { 0% {opacity:.8;transform:scaleX(.02)} 100% {opacity:0;transform:scaleX(1)} }
    @media (prefers-reduced-motion:no-preference) {
      .letter { animation:drop 1.55s linear var(--delay) both }
      .stop { animation:stamp .62s linear 2.02s both }
      .wave { transform-origin:821px 236px; animation:impact .44s ease-out 2.64s forwards }
    }
  </style>
  <rect width="960" height="310" rx="16" fill="url(#paper)"/>
  <g fill="none" stroke="#70a9e8" opacity=".17">
    <path d="M590 0q-65 52 91 85t180 95"/>
