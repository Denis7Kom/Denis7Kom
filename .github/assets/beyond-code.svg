<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="t d">
  <title id="t">Beyond the code</title>
  <desc id="d">Five tiles: photography, aerial video, aviation, writing and tourism.</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.rot{transform-box:fill-box;transform-origin:center;animation:rot 12s linear infinite}
.prop{transform-box:fill-box;transform-origin:center;animation:rot 1.1s linear infinite}
.sway{transform-box:fill-box;transform-origin:center;animation:sway 5s ease-in-out infinite alternate}
.ln{animation:ln 3s ease-in-out infinite}
.bounce{animation:bounce 1.8s ease-in-out infinite alternate}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes ln{0%,100%{opacity:.25}40%{opacity:1}}
@keyframes bounce{to{transform:translateY(-5px)}}
</style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#141d28" stroke-width="1"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#101a26"/><stop offset="1" stop-color="#0a0e13"/></radialGradient>
    
  </defs>
  <rect x="1" y="1" width="638" height="234" rx="14" fill="url(#vig)" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="638" height="234" rx="14" fill="url(#grid)"/>

  <text class="m" x="30" y="40" font-size="13" letter-spacing="1.5" fill="#8497ad">BEYOND THE CODE</text>
  <text class="s" x="30" y="64" font-size="17" fill="#e6f1ff">Composition, movement and precision shape how I build.</text>
<rect x="16" y="82" width="112" height="136" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="72" y="198" font-size="16" font-weight="700" fill="#e6f1ff" text-anchor="middle">Photo</text><g transform="translate(72,134)"><circle r="24" fill="none" stroke="#5ad1ff" stroke-width="2"/><g class="rot" stroke="#5ad1ff" stroke-width="2"><path d="M0 0L22.0 0.0"/><path d="M0 0L11.0 19.1"/><path d="M0 0L-11.0 19.1"/><path d="M0 0L-22.0 0.0"/><path d="M0 0L-11.0 -19.1"/><path d="M0 0L11.0 -19.1"/><circle r="8" fill="none"/></g></g><rect x="140" y="82" width="112" height="136" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="196" y="198" font-size="16" font-weight="700" fill="#e6f1ff" text-anchor="middle">Aerial</text><g transform="translate(196,134)"><path d="M-15 -15L15 15M15 -15L-15 15" stroke="#3ddc97" stroke-width="2"/><circle class="prop" cx="-20" cy="-20" r="9" fill="none" stroke="#3ddc97" stroke-width="2" stroke-dasharray="7 5"/><circle class="prop" cx="20" cy="-20" r="9" fill="none" stroke="#3ddc97" stroke-width="2" stroke-dasharray="7 5"/><circle class="prop" cx="-20" cy="20" r="9" fill="none" stroke="#3ddc97" stroke-width="2" stroke-dasharray="7 5"/><circle class="prop" cx="20" cy="20" r="9" fill="none" stroke="#3ddc97" stroke-width="2" stroke-dasharray="7 5"/><rect x="-8" y="-8" width="16" height="16" rx="4" fill="#111821" stroke="#3ddc97" stroke-width="2"/></g><rect x="264" y="82" width="112" height="136" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="320" y="198" font-size="16" font-weight="700" fill="#e6f1ff" text-anchor="middle">Aviation</text><g transform="translate(320,134)"><path class="sway" d="M0 -26L4 -9L24 3L24 8L4 4L3 17L10 22L10 26L0 23L-10 26L-10 22L-3 17L-4 4L-24 8L-24 3L-4 -9Z" fill="none" stroke="#f5c451" stroke-width="2" stroke-linejoin="round"/></g><rect x="388" y="82" width="112" height="136" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="444" y="198" font-size="16" font-weight="700" fill="#e6f1ff" text-anchor="middle">Writing</text><g transform="translate(444,134)"><rect x="-21" y="-26" width="42" height="52" rx="5" fill="none" stroke="#b79cff" stroke-width="2"/><path class="ln" style="animation-delay:0.0s" d="M-12 -10H12" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round"/><path class="ln" style="animation-delay:0.4s" d="M-12 -1H7" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round"/><path class="ln" style="animation-delay:0.8s" d="M-12 8H12" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round"/><path class="ln" style="animation-delay:1.2s" d="M-12 17H7" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round"/></g><rect x="512" y="82" width="112" height="136" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="568" y="198" font-size="16" font-weight="700" fill="#e6f1ff" text-anchor="middle">Tourism</text><g transform="translate(568,134)"><g class="bounce"><path d="M0 -24C-12 -24 -17 -14 -17 -7C-17 5 0 22 0 22C0 22 17 5 17 -7C17 -14 12 -24 0 -24Z" fill="none" stroke="#ff9e7a" stroke-width="2"/><circle cy="-7" r="6" fill="none" stroke="#ff9e7a" stroke-width="2"/></g></g>
  <path d="M14 32V14H32 M608 14H626V32 M14 204V222H32 M608 222H626V204" fill="none" stroke="#3ddc97" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
</svg>
