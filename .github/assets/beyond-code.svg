<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" role="img" aria-labelledby="t d">
  <title id="t">Beyond the code</title>
  <desc id="d">Five tiles with small animated icons: photography, aerial video, aviation, writing and tourism (DeA, Scalea and Naples).</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.rot{transform-box:fill-box;transform-origin:center;animation:rot 12s linear infinite}
.prop{transform-box:fill-box;transform-origin:center;animation:rot 1.1s linear infinite}
.sway{transform-box:fill-box;transform-origin:center;animation:sway 5s ease-in-out infinite alternate}
.ln{animation:ln 3s ease-in-out infinite}
.bounce{animation:bounce 1.8s ease-in-out infinite alternate}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 2.4s ease-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes ln{0%,100%{opacity:.25}40%{opacity:1}}
@keyframes bounce{to{transform:translateY(-6px)}}
@keyframes rip{from{transform:scale(.4);opacity:.9}to{transform:scale(1.5);opacity:0}}
</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141d28" stroke-width="1"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#101a26"/><stop offset="1" stop-color="#0a0e13"/></radialGradient>
    <clipPath id="card"><rect x="2" y="2" width="896" height="258" rx="13"/></clipPath>
    
  </defs>
  <rect x="1" y="1" width="898" height="260" rx="14" fill="url(#vig)" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="260" rx="14" fill="url(#grid)"/>

  <text class="m" x="36" y="46" font-size="11" letter-spacing="1.5" fill="#7a8ba0">BEYOND THE CODE</text>
  <text class="s" x="36" y="70" font-size="16" fill="#e6f1ff">Composition, movement and precision shape how I build software.</text>
<rect x="24" y="88" width="160" height="150" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="104" y="202" font-size="15" font-weight="700" fill="#e6f1ff" text-anchor="middle">Photography</text><text class="m" x="104" y="222" font-size="11.5" fill="#9fb3c8" text-anchor="middle">composition · light</text><g transform="translate(104,140)"><circle r="28" fill="none" stroke="#5ad1ff" stroke-width="2"/><g class="rot" stroke="#5ad1ff" stroke-width="2" opacity=".85"><path d="M0 0L26.0 0.0"/><path d="M0 0L13.0 22.5"/><path d="M0 0L-13.0 22.5"/><path d="M0 0L-26.0 0.0"/><path d="M0 0L-13.0 -22.5"/><path d="M0 0L13.0 -22.5"/><circle r="9" fill="none"/></g></g><rect x="196" y="88" width="160" height="150" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="276" y="202" font-size="15" font-weight="700" fill="#e6f1ff" text-anchor="middle">Aerial video</text><text class="m" x="276" y="222" font-size="11.5" fill="#9fb3c8" text-anchor="middle">perspective · motion</text><g transform="translate(276,140)"><path d="M-18 -18L18 18M18 -18L-18 18" stroke="#3ddc97" stroke-width="2"/><circle class="prop" cx="-24" cy="-24" r="10" fill="none" stroke="#3ddc97" stroke-width="2" stroke-dasharray="8 6"/><circle class="prop" cx="24" cy="-24" r="10" fill="none" stroke="#3ddc97" stroke-width="2" stroke-dasharray="8 6"/><circle class="prop" cx="-24" cy="24" r="10" fill="none" stroke="#3ddc97" stroke-width="2" stroke-dasharray="8 6"/><circle class="prop" cx="24" cy="24" r="10" fill="none" stroke="#3ddc97" stroke-width="2" stroke-dasharray="8 6"/><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#111821" stroke="#3ddc97" stroke-width="2"/></g><rect x="368" y="88" width="160" height="150" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="448" y="202" font-size="15" font-weight="700" fill="#e6f1ff" text-anchor="middle">Aviation</text><text class="m" x="448" y="222" font-size="11.5" fill="#9fb3c8" text-anchor="middle">systems · procedures</text><g transform="translate(448,140)"><path class="sway" d="M0 -30L5 -10L28 4L28 10L5 5L3 20L11 26L11 30L0 27L-11 30L-11 26L-3 20L-5 5L-28 10L-28 4L-5 -10Z" fill="none" stroke="#f5c451" stroke-width="2" stroke-linejoin="round"/></g><rect x="540" y="88" width="160" height="150" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="620" y="202" font-size="15" font-weight="700" fill="#e6f1ff" text-anchor="middle">Writing</text><text class="m" x="620" y="222" font-size="11.5" fill="#9fb3c8" text-anchor="middle">books · documentation</text><g transform="translate(620,140)"><rect x="-24" y="-30" width="48" height="60" rx="5" fill="none" stroke="#b79cff" stroke-width="2"/><path class="ln" style="animation-delay:0.0s" d="M-14 -12H14" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round"/><path class="ln" style="animation-delay:0.4s" d="M-14 -2H8" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round"/><path class="ln" style="animation-delay:0.8s" d="M-14 8H14" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round"/><path class="ln" style="animation-delay:1.2s" d="M-14 18H8" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round"/></g><rect x="712" y="88" width="160" height="150" rx="12" fill="#0d1520" stroke="#243242" stroke-width="1.5"/><text class="s" x="792" y="202" font-size="15" font-weight="700" fill="#e6f1ff" text-anchor="middle">Tourism</text><text class="m" x="792" y="222" font-size="11.5" fill="#9fb3c8" text-anchor="middle">DeA · Scalea · Naples</text><g transform="translate(792,140)"><ellipse class="rip" cx="0" cy="30" rx="16" ry="5" fill="none" stroke="#ff9e7a" stroke-width="2"/><g class="bounce"><path d="M0 -28C-14 -28 -20 -16 -20 -8C-20 6 0 26 0 26C0 26 20 6 20 -8C20 -16 14 -28 0 -28Z" fill="none" stroke="#ff9e7a" stroke-width="2"/><circle cy="-8" r="7" fill="none" stroke="#ff9e7a" stroke-width="2"/></g></g>
  <path d="M16 36V16H36 M864 16H884V36 M16 226V246H36 M864 246H884V226" fill="none" stroke="#3ddc97" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
</svg>
