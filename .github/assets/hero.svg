<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
  <title id="t">DEN7BEST (Denis Komarov): I build Java web applications and learn how to make them safer</title>
  <desc id="d">Profile header with the handle DEN7BEST, the name Denis Komarov, a one-sentence value statement, an open-to-work badge, the city Naples and a small artificial-horizon instrument.</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.bank{transform-origin:548px 112px;animation:bank 8s ease-in-out infinite alternate}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes bank{from{transform:rotate(-6deg) translateY(-3px)}to{transform:rotate(6deg) translateY(3px)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
</style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#141d28" stroke-width="1"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#101a26"/><stop offset="1" stop-color="#0a0e13"/></radialGradient>
    
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2236"/><stop offset="1" stop-color="#15385a"/></linearGradient>
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22391f"/><stop offset="1" stop-color="#111c12"/></linearGradient>
    <clipPath id="ai"><circle cx="548" cy="112" r="50"/></clipPath>
  </defs>
  <rect x="1" y="1" width="638" height="298" rx="14" fill="url(#vig)" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="638" height="298" rx="14" fill="url(#grid)"/>

  <text class="m" x="36" y="52" font-size="14" fill="#8497ad">// PROFILE</text>
  <text class="m" x="36" y="108" font-size="52" font-weight="700" fill="#e6f1ff">DEN7BEST<tspan class="blink" fill="#3ddc97">_</tspan></text>
  <text class="s" x="38" y="140" font-size="20" fill="#9fb3c8">Denis Komarov</text>
  <text class="s" x="36" y="186" font-size="23" font-weight="600" fill="#e6f1ff">I build Java web applications</text>
  <text class="s" x="36" y="214" font-size="23" font-weight="600" fill="#5ad1ff">and learn how to make them safer.</text>
  <rect x="36" y="238" width="196" height="38" rx="19" fill="#0f1a16" stroke="#3ddc97" stroke-width="2"/>
  <circle class="pulse" cx="60" cy="257" r="6" fill="#3ddc97"/>
  <text class="m" x="76" y="263" font-size="16" font-weight="700" fill="#3ddc97">OPEN TO WORK</text>
