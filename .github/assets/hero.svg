  <text class="m" x="319" y="263" font-size="16" text-anchor="middle" fill="#e6f1ff">NAPLES · IT</text>

  <circle cx="548" cy="112" r="58" fill="#0a0e13" stroke="#243242" stroke-width="2"/>
  <g clip-path="url(#ai)"><g class="bank">
    <rect x="440" y="0" width="220" height="112" fill="url(#sky)"/>
    <rect x="440" y="112" width="220" height="140" fill="url(#gnd)"/>
    <path d="M440 112H660" stroke="#5ad1ff" stroke-width="2"/>
