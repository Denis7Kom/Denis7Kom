<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 272" role="img" aria-labelledby="t d">
  <title id="t">DEN7BEST: software, web applications and application security</title>
  <desc id="d">Dark avionics-style banner with the name DEN7BEST, a role line, the city Naples, an open-to-work badge, an artificial-horizon instrument and a scrolling heading tape.</desc>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.scan{animation:scan 9s linear infinite}
.tape{animation:tape 72s linear infinite}
.bank{transform-origin:850px 112px;animation:bank 7s ease-in-out infinite alternate}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-220px)}to{transform:translateX(1060px)}}
@keyframes tape{to{transform:translateX(-1200px)}}
@keyframes bank{from{transform:rotate(-7deg) translateY(-4px)}to{transform:rotate(7deg) translateY(4px)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141d28" stroke-width="1"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#101a26"/><stop offset="1" stop-color="#0a0e13"/></radialGradient>
    <clipPath id="card"><rect x="2" y="2" width="996" height="268" rx="13"/></clipPath>
    
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#5ad1ff" stop-opacity="0"/><stop offset=".5" stop-color="#5ad1ff" stop-opacity=".18"/><stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2236"/><stop offset="1" stop-color="#15385a"/></linearGradient>
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22391f"/><stop offset="1" stop-color="#111c12"/></linearGradient>
    <clipPath id="ai"><circle cx="850" cy="112" r="72"/></clipPath>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>

  </defs>
  <rect x="1" y="1" width="998" height="270" rx="14" fill="url(#vig)" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="270" rx="14" fill="url(#grid)"/>

  <g clip-path="url(#card)"><rect class="scan" x="0" y="2" width="180" height="268" fill="url(#sweep)"/></g>
  <text class="m" x="48" y="44" font-size="13" fill="#7a8ba0">// PROFILE · NAV-01</text>
  <text class="m" x="48" y="108" font-size="64" font-weight="700" fill="#3ddc97" opacity=".28" filter="url(#glow)">DEN7BEST</text>
  <text class="m" x="48" y="108" font-size="64" font-weight="700" fill="#e6f1ff">DEN7BEST<tspan class="blink" fill="#3ddc97">_</tspan></text>
  <text class="m" x="50" y="144" font-size="19" fill="#5ad1ff">Software · Web applications · Application security</text>
  <text class="m" x="50" y="170" font-size="14" fill="#9fb3c8">Computer Science (L-31), University of Salerno</text>
