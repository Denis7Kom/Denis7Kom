<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" role="img" aria-labelledby="wt wd">
<title id="wt">Denis7Kom — whoami development console</title>
<desc id="wd">Animated professional developer terminal with an identity summary, current focus matrix and an engineering loop. The signals are conceptual rather than live telemetry.</desc>
<defs>
  <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#182639"/><stop offset="100%" stop-color="#090f18"/></linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop stop-color="#35d0ba"/><stop offset=".52" stop-color="#6abbdc"/><stop offset="1" stop-color="#9b83f5"/></linearGradient>
  <linearGradient id="pulse" x1="0%" y1="0%" x2="0%" y2="100%"><stop stop-color="#35d0ba" stop-opacity=".32"/><stop offset="100%" stop-color="#35d0ba" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#314357" stroke-opacity=".24"/></pattern>
  <clipPath id="screen"><rect x="30" y="68" width="900" height="326" rx="7"/></clipPath>
</defs>
<style>
text{font-family:Consolas,'Liberation Mono',monospace;fill:#e6eef8}
.muted{fill:#9aaec4}.cyan{fill:#35d0ba}.violet{fill:#b7a5ff}.gold{fill:#f5c451}
.appear{animation:reveal 4s ease-out both}.appear2{animation:reveal 4s .18s ease-out both}.appear3{animation:reveal 4s .36s ease-out both}.appear4{animation:reveal 4s .55s ease-out both}
.cursor{animation:blink 1.1s steps(1) infinite}.signal{animation:signal 3.6s ease-in-out infinite}.signal2{animation:signal 3.6s -1.3s ease-in-out infinite}
.trace{stroke-dasharray:11 17;animation:trace 4s linear infinite}
.wire{stroke-dasharray:4 12;animation:trace 5.2s linear infinite reverse}
.breathe{animation:breathe 4s ease-in-out infinite}
.breathe2{animation:breathe 4s -1.6s ease-in-out infinite}
@keyframes reveal{0%{opacity:.05;transform:translateY(7px)}16%,100%{opacity:1;transform:translateY(0)}}
@keyframes blink{50%{opacity:0}}@keyframes signal{50%{opacity:.25}}
@keyframes trace{to{stroke-dashoffset:-112}}
@keyframes breathe{50%{opacity:.62}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="416" rx="18" fill="url(#background)"/>
<rect width="960" height="416" rx="18" fill="url(#grid)"/>
<rect x="17" y="17" width="926" height="382" rx="14" fill="#0b121c" stroke="#3b4b62" stroke-width="1.7"/>
<path d="M17 57H943" stroke="#35475c" stroke-width="1.3"/>
<circle cx="40" cy="37" r="5.7" fill="#ff6b7c"/><circle cx="60" cy="37" r="5.7" fill="#f5c451"/><circle cx="80" cy="37" r="5.7" fill="#35d0ba"/>
<text x="104" y="42" font-size="12" class="muted">denis7kom@engineering-lab : ~/profile</text>
<circle cx="812" cy="37" r="4" fill="#35d0ba" class="signal"/><text x="827" y="42" font-size="10" class="cyan" letter-spacing="1">DEV MODE</text>
<g clip-path="url(#screen)">
  <path d="M600 80V365" stroke="#293a4b"/>
  <g class="appear">
    <text x="45" y="107" font-size="16"><tspan class="cyan">$</tspan> whoami --verbose</text>
    <text x="44" y="158" font-size="43" font-weight="700" letter-spacing="-1.5">Denis7Kom<tspan class="cursor" fill="#35d0ba">_</tspan></text>
    <text x="45" y="182" font-size="12" class="muted" letter-spacing=".7">SOFTWARE  /  INTERACTIVE SYSTEMS  /  APPSEC</text>
  </g>
  <path d="M45 199H574" stroke="#293c53"/>
  <g class="appear2">
    <text x="45" y="226" font-size="13"><tspan class="violet">focus   </tspan><tspan fill="#dce7f5">: application logic + interface behaviour</tspan></text>
    <text x="45" y="249" font-size="13"><tspan class="violet">security</tspan><tspan fill="#dce7f5">: trust boundaries + code review</tspan></text>
    <text x="45" y="272" font-size="13"><tspan class="violet">method  </tspan><tspan fill="#dce7f5">: understand &gt; build &gt; test &gt; refine</tspan></text>
    <text x="45" y="295" font-size="13"><tspan class="violet">mindset </tspan><tspan fill="#dce7f5">: evidence over assumptions</tspan></text>
  </g>
  <path d="M45 313H574" stroke="#293c53"/>
  <g class="appear3">
    <text x="45" y="341" font-size="13"><tspan class="cyan">➜ </tspan><tspan>cat ./next-iteration</tspan></text>
    <text x="45" y="365" font-size="13" class="gold">build small  //  verify deeply  //  improve</text>
  </g>
  <g class="appear4">
    <rect x="621" y="82" width="291" height="186" rx="10" fill="#101d2c" stroke="#344c63"/>
    <text x="638" y="105" font-size="11" class="muted" letter-spacing="1.5">CURRENT FOCUS / NOT A RATING</text>
    <circle cx="884" cy="101" r="3.5" fill="#35d0ba" class="signal2"/>
    <text x="638" y="138" font-size="13">APPLICATION ENGINEERING</text>
    <path d="M640 150H891" stroke="#263e54" stroke-width="5" stroke-linecap="round"/>
    <path d="M640 150H834" stroke="#35d0ba" stroke-width="5" stroke-linecap="round" class="breathe"/>
    <text x="638" y="180" font-size="13">INTERACTIVE EXPERIENCES</text>
    <path d="M640 192H891" stroke="#263e54" stroke-width="5" stroke-linecap="round"/>
    <path d="M640 192H866" stroke="#9b83f5" stroke-width="5" stroke-linecap="round" class="breathe2"/>
    <text x="638" y="222" font-size="13">APPLICATION SECURITY STUDY</text>
    <path d="M640 234H891" stroke="#263e54" stroke-width="5" stroke-linecap="round"/>
    <path d="M640 234H793" stroke="#f5c451" stroke-width="5" stroke-linecap="round" class="breathe"/>
    <rect x="621" y="285" width="291" height="91" rx="10" fill="#101b29" stroke="#344c63"/>
    <text x="639" y="308" font-size="11" class="muted" letter-spacing="1.5">ENGINEERING FEEDBACK LOOP</text>
    <g stroke="url(#accent)" stroke-width="2" fill="none">
      <path d="M655 339H879" opacity=".4"/><path d="M655 339H879" class="trace"/>
      <path d="M879 339V354H655V339" stroke="#6b6aaf" class="wire" opacity=".7"/>
    </g>
    <g fill="#0e202b" stroke="#38bdad" stroke-width="1.4">
      <circle cx="657" cy="339" r="9"/><circle cx="731" cy="339" r="9"/><circle cx="805" cy="339" r="9"/><circle cx="879" cy="339" r="9"/>
    </g>
    <g font-size="10" text-anchor="middle" class="muted">
      <text x="657" y="367">PLAN</text><text x="731" y="367">BUILD</text><text x="805" y="367">TEST</text><text x="879" y="367">REFINE</text>
    </g>
  </g>
</g>
</svg>