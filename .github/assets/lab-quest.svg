<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-label="Pixel development quest: learn, build, test, repeat"><title>Pixel development quest: learn, build, test, repeat</title><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#263446" fill="none" opacity=".35"/></pattern><linearGradient id="bg"><stop stop-color="#172231"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>text{font-family:Consolas,'Liberation Mono',monospace;fill:#e6edf3}.muted{fill:#91a0b5}.green{fill:#35d0ba}.gold{fill:#f5c451}.blink{animation:blink 1.2s steps(1) infinite}.walk{animation:walk 8s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.packet{stroke-dasharray:12 220;animation:packet 5s linear infinite}@keyframes blink{50%{opacity:0}}@keyframes walk{0%{transform:translateX(0)}50%{transform:translateX(70px)}100%{transform:translateX(0)}}@keyframes pulse{50%{opacity:.35}}@keyframes packet{to{stroke-dashoffset:-464}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="180" rx="14" fill="url(#bg)"/><rect width="960" height="180" rx="14" fill="url(#grid)"/><rect x="16" y="16" width="928" height="148" fill="#201431" stroke="#8660bf" stroke-width="3"/><text x="36" y="44" font-size="12" class="gold" letter-spacing="3">DEVELOPMENT QUEST</text><path d="M36 142H924" stroke="#f5c451" stroke-width="4" stroke-dasharray="16 5"/><text x="210" y="72" font-size="13" class="green">LEARN</text><rect x="229" y="91" width="12" height="12" fill="#f5c451" class="pulse"/><text x="415" y="72" font-size="13" class="gold">BUILD</text><rect x="434" y="91" width="12" height="12" fill="#f5c451" class="pulse"/><text x="620" y="72" font-size="13" class="green">TEST</text><rect x="639" y="91" width="12" height="12" fill="#f5c451" class="pulse"/><text x="825" y="72" font-size="13" class="gold">REPEAT</text><rect x="844" y="91" width="12" height="12" fill="#f5c451" class="pulse"/><g class="walk"><g transform="translate(63 92) scale(.75)"><path d="M0 0h24v8h8v24h-8v8H0v-8h-8V8H0Z" fill="#35d0ba"/><path d="M0 12h8v8H0Zm16 0h8v8h-8Z" fill="#171127"/><path d="M0 40h8v8H0Zm16 0h8v8h-8Z" fill="#f5c451"/></g></g></svg>