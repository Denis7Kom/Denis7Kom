<svg xmlns="http://www.w3.org/2000/svg" width="960" height="36" viewBox="0 0 960 36" role="img" aria-labelledby="title desc"><title id="title">Decorative signal trace</title><desc id="desc">Decorative animated artwork. No live metrics or status indicators.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1727"/><stop offset="1" stop-color="#080d16"/></linearGradient><linearGradient id="accent"><stop stop-color="#62e8ce"/><stop offset="1" stop-color="#729dff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#203147" stroke-width=".6"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf4ff}.mono{font-family:Consolas,monospace;letter-spacing:2px}.muted{fill:#8c9eb6}.accent{fill:#62e8ce}.flow{stroke-dasharray:7 180;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.rotate{transform-origin:790px 164px;animation:rotate 36s linear infinite}.float{animation:float 7s ease-in-out infinite}.reveal{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 8s ease-in-out infinite}.cursor{animation:blink 1.5s steps(1) infinite}@keyframes flow{to{stroke-dashoffset:-748}}@keyframes pulse{50%{opacity:.35}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes trace{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:120}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="34" rx="16" fill="url(#bg)" stroke="#27364a"/><path d="M20 18H370L380 8 396 28 410 18H940" fill="none" stroke="#26394f"/><path class="flow" d="M20 18H370L380 8 396 28 410 18H940" fill="none" stroke="#62e8ce" stroke-width="1.5"/></svg>