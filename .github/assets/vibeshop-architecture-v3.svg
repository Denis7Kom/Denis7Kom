<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="t d">
<title id="t">VibeShop architecture — JSP, Servlets, DAO, SQL</title><desc id="d">An animated technical diagram showing storefront JSP pages, servlet routing, data access objects and relational database, with authentication and admin filters on protected routes.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b36"/><stop offset="1" stop-color="#101825"/></linearGradient><linearGradient id="line" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#35d0ba"/></linearGradient></defs>
<style>text{font-family:Consolas,'Liberation Mono',monospace;fill:#ecf1fa}.muted{fill:#9eaec3}.cyan{fill:#63e1de}.lav{fill:#c0a8ff}.gold{fill:#f5c451}.path{stroke-dasharray:9 18;animation:flow 4s linear infinite}.path2{stroke-dasharray:9 18;animation:flow 4s -1.5s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.p2{animation:pulse 3s -1s ease-in-out infinite}.p3{animation:pulse 3s -2s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-135}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="959" height="319" rx="15" fill="url(#bg)" stroke="#3c3f63"/>
<text x="27" y="31" font-size="13" class="lav" letter-spacing="1.7">VIBESHOP / REQUEST LIFECYCLE</text><text x="934" y="31" font-size="11" text-anchor="end" class="muted">SOURCE-VERIFIED COMPONENTS</text>
<path d="M60 157H900" stroke="#323d5d" stroke-width="4"/><path d="M60 157H900" stroke="url(#line)" stroke-width="3" class="path"/>
<g><rect x="21" y="67" width="212" height="174" rx="13" fill="#201d39" stroke="#7d67ab"/><text x="38" y="92" class="lav" font-size="12">01 / PRESENTATION</text><text x="38" y="125" font-size="25" font-weight="bold">JSP + CSS</text><text x="38" y="147" font-size="12" class="muted">Storefront interface</text><path d="M38 169h174m-174 14h174" stroke="#38375e"/><text x="38" y="202" font-size="12">Concerts / Artists</text><text x="38" y="220" font-size="12">Merch / Cart / Orders</text></g>
<g><rect x="256" y="67" width="212" height="174" rx="13" fill="#1b263b" stroke="#5d67a3"/><text x="273" y="92" class="lav" font-size="12">02 / CONTROLLER</text><text x="273" y="125" font-size="25" font-weight="bold">Servlets</text><text x="273" y="147" font-size="12" class="muted">Request handlers</text><path d="M273 169h174m-174 14h174" stroke="#383f60"/><text x="273" y="202" font-size="12">Cart / Checkout</text><text x="273" y="220" font-size="12">Login / Admin / Search</text></g>
<g><rect x="491" y="67" width="212" height="174" rx="13" fill="#162c34" stroke="#3a9180"/><text x="508" y="92" class="cyan" font-size="12">03 / DATA ACCESS</text><text x="508" y="125" font-size="25" font-weight="bold">DAO layer</text><text x="508" y="147" font-size="12" class="muted">Models &amp; queries</text><path d="M508 169h174m-174 14h174" stroke="#2d5556"/><text x="508" y="202" font-size="12">User / Product / Order</text><text x="508" y="220" font-size="12">Artist / Concert</text></g>
<g><rect x="726" y="67" width="212" height="174" rx="13" fill="#1a2934" stroke="#947d54"/><text x="743" y="92" class="gold" font-size="12">04 / PERSISTENCE</text><text x="743" y="125" font-size="25" font-weight="bold">SQL schema</text><text x="743" y="147" font-size="12" class="muted">Relational records</text><path d="M743 169h174m-174 14h174" stroke="#514a45"/><text x="743" y="202" font-size="12">Users / Orders</text><text x="743" y="220" font-size="12">Products / Concerts</text></g>
<g><rect x="24" y="257" width="910" height="46" rx="8" fill="#141d2d" stroke="#4a4266"/><circle cx="43" cy="280" r="5" fill="#bca0ff" class="pulse"/><text x="57" y="283" font-size="12" class="lav">AUTH FILTER</text><path d="M171 279h85" stroke="#55577a" stroke-width="2" class="path2"/><circle cx="280" cy="280" r="5" fill="#bca0ff" class="p2"/><text x="294" y="283" font-size="12" class="lav">ADMIN FILTER</text><path d="M406 279h84" stroke="#55577a" stroke-width="2" class="path2"/><circle cx="509" cy="280" r="5" fill="#35d0ba" class="p3"/><text x="523" y="283" font-size="12" class="cyan">ROUTE GUARDS IN SOURCE</text><text x="916" y="283" font-size="10" text-anchor="end" class="muted">NOT A SECURITY AUDIT</text></g>
</svg>