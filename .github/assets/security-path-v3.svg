<svg xmlns="http://www.w3.org/2000/svg" width="960" height="265" viewBox="0 0 960 265" role="img" aria-labelledby="t d">
<title id="t">Application Security — trace, model, test, verify</title><desc id="d">Four-stage animated application-security learning workflow. Source to boundary to failure case to regression check, with secure-by-design principles.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18263a"/><stop offset="1" stop-color="#0d121d"/></linearGradient><linearGradient id="trace" x2="1" y2="0"><stop stop-color="#35d0ba"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f5c451"/></linearGradient></defs>
<style>text{font-family:Consolas,'Liberation Mono',monospace;fill:#e8eef9}.muted{fill:#94a6bb}.cyan{fill:#35d0ba}.gold{fill:#f5c451}.purple{fill:#b49cff}.flow{stroke-dasharray:13 18;animation:flow 4s linear infinite}.beacon{animation:beacon 3s ease-in-out infinite}.beacon2{animation:beacon 3s -1s ease-in-out infinite}.beacon3{animation:beacon 3s -2s ease-in-out infinite}.meter{animation:meter 3.4s ease-in-out infinite alternate;transform-origin:left center}@keyframes flow{to{stroke-dashoffset:-124}}@keyframes beacon{50%{opacity:.32}}@keyframes meter{50%{transform:scaleX(.6)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="959" height="264" rx="14" fill="url(#bg)" stroke="#33475c"/>
<text x="24" y="31" class="cyan" font-size="12" letter-spacing="2">APPLICATION SECURITY / EXPLORATION MAP</text><text x="936" y="31" class="muted" text-anchor="end" font-size="11">TRACE THE TRUST BOUNDARY</text>
<path d="M79 119H888" stroke="#344a5e" stroke-width="3"/><path d="M79 119H888" stroke="url(#trace)" stroke-width="3" class="flow"/>
<g><rect x="22" y="63" width="214" height="112" rx="10" fill="#101c2b" stroke="#397569"/><text x="38" y="88" class="cyan" font-size="12">01 / ENTRY POINT</text><text x="38" y="119" font-size="20" font-weight="bold">TRACE INPUT</text><text x="38" y="145" class="muted" font-size="12">source → sink</text><circle cx="217" cy="78" r="4" fill="#35d0ba" class="beacon"/></g>
<g><rect x="256" y="63" width="214" height="112" rx="10" fill="#111d30" stroke="#655ba1"/><text x="272" y="88" class="purple" font-size="12">02 / IDENTITY</text><text x="272" y="119" font-size="20" font-weight="bold">CHECK ACCESS</text><text x="272" y="145" class="muted" font-size="12">user ≠ owner</text><circle cx="451" cy="78" r="4" fill="#a38cf8" class="beacon2"/></g>
<g><rect x="490" y="63" width="214" height="112" rx="10" fill="#111e30" stroke="#655ba1"/><text x="506" y="88" class="purple" font-size="12">03 / ASSUMPTIONS</text><text x="506" y="119" font-size="20" font-weight="bold">REVIEW LOGIC</text><text x="506" y="145" class="muted" font-size="12">paths &amp; failure cases</text><circle cx="685" cy="78" r="4" fill="#a38cf8" class="beacon3"/></g>
<g><rect x="724" y="63" width="214" height="112" rx="10" fill="#242334" stroke="#9f8244"/><text x="740" y="88" class="gold" font-size="12">04 / EVIDENCE</text><text x="740" y="119" font-size="20" font-weight="bold">VERIFY FIX</text><text x="740" y="145" class="muted" font-size="12">reproduce → regression</text><circle cx="919" cy="78" r="4" fill="#f5c451" class="beacon"/></g>
<rect x="22" y="193" width="916" height="51" rx="8" fill="#101a29" stroke="#2c4057"/><text x="37" y="213" class="muted" font-size="10" letter-spacing="1.1">SECURITY INVARIANTS</text>
<text x="38" y="232" font-size="12" class="cyan">VALIDATE AT BOUNDARIES</text><text x="340" y="232" font-size="12" class="purple">AUTHORIZE EACH OBJECT</text><text x="684" y="232" font-size="12" class="gold">TEST FAILURES TOO</text>
<rect x="38" y="238" width="190" height="2" fill="#35d0ba" class="meter"/><rect x="340" y="238" width="199" height="2" fill="#8b5cf6" class="meter"/><rect x="684" y="238" width="172" height="2" fill="#f5c451" class="meter"/>
</svg>