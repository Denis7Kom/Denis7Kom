<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">Denis7Kom</title>
  <desc id="desc">Denis7Kom in Battley RUS lettering. Letters appear in sequence, descend slowly and accelerate into a firm landing. The teal full stop lands last.</desc>
  <defs>
    <linearGradient id="paper" x2=".3" y2="1"><stop stop-color="#172438"/><stop offset="1" stop-color="#0d1117"/></linearGradient><radialGradient id="teal"><stop stop-color="#35d0ba" stop-opacity=".15"/><stop offset="1" stop-color="#35d0ba" stop-opacity="0"/></radialGradient><radialGradient id="violet"><stop stop-color="#ad8df8" stop-opacity=".12"/><stop offset="1" stop-color="#ad8df8" stop-opacity="0"/></radialGradient>
    <pattern id="ticks" width="20" height="9" patternUnits="userSpaceOnUse"><path d="M1 0v6" stroke="#60758f" opacity=".55"/></pattern>
  </defs>
  <style>
    @keyframes drop {
      0% { opacity:0; transform:translateY(-260px) }
      20% { opacity:1; transform:translateY(-250px) }
      65% { transform:translateY(-210px); animation-timing-function:cubic-bezier(.66,0,1,.55) }
      94% { transform:translateY(0) scaleY(1) }
      96% { transform:translateY(0) scaleY(.965) }
      100% { transform:translateY(0) scaleY(1) }
    }
    @keyframes stamp {
      0% { opacity:0; transform:translateY(-115px) }
      30% { opacity:1; transform:translateY(-110px); animation-timing-function:cubic-bezier(.7,0,1,.5) }
      100% { transform:translateY(0) }
    }
    @keyframes impact { 0% {opacity:.8;transform:scaleX(.02)} 100% {opacity:0;transform:scaleX(1)} }
    @media (prefers-reduced-motion:no-preference) {
      .letter { animation:drop 1.55s linear var(--delay) both }
      .stop { animation:stamp .62s linear 2.02s both }
      .wave { transform-origin:865px 236px; animation:impact .44s ease-out 2.64s forwards }
    }
  </style>
