<svg xmlns="http://www.w3.org/2000/svg" width="960" height="294" viewBox="0 0 960 294" role="img" aria-labelledby="title description">
<title id="title">Beyond the Code — Photography, Aerial Video and Aviation</title>
<desc id="description">Three animated visual panels showing composition and light, aerial perspective and motion, and aviation systems and precision.</desc>
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#172437"/><stop offset="100%" stop-color="#0b111b"/></linearGradient>
  <linearGradient id="tint" x1="0%" y1="0%" x2="100%" y2="0%"><stop stop-color="#35d0ba"/><stop offset=".5" stop-color="#8b9cf9"/><stop offset="1" stop-color="#f5c451"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#334358" opacity=".27" fill="none"/></pattern>
</defs>
<style>
text{font-family:Consolas,'Liberation Mono',monospace;fill:#edf3fb}.muted{fill:#a1b1c4}.cyan{fill:#35d0ba}.violet{fill:#b8a7ff}.gold{fill:#f5c451}
.rotate{animation:rotate 12s linear infinite;transform-origin:162px 155px}
.focus{animation:focus 5s ease-in-out infinite;transform-origin:162px 155px}
.rotorL{animation:rotor 2s linear infinite;transform-origin:438px 141px}
.rotorR{animation:rotor 2s linear infinite;transform-origin:534px 141px}
.float{animation:float 4s ease-in-out infinite}
.path{stroke-dasharray:10 17;animation:flow 3.5s linear infinite}
.scope{animation:focus 3.5s ease-in-out infinite;transform-origin:795px 151px}
.ping{animation:ping 2.5s ease-in-out infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes rotor{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes flow{to{stroke-dashoffset:-108}}
@keyframes focus{50%{opacity:.46}}
@keyframes ping{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="294" rx="15" fill="url(#bg)"/>
<rect width="960" height="294" rx="15" fill="url(#grid)"/>
<rect x=".5" y=".5" width="959" height="293" rx="15" stroke="#36455a" fill="none"/>
<text x="24" y="31" font-size="12" class="cyan" letter-spacing="1.7">CREATIVE DISCIPLINES / SHARED ENGINEERING PRINCIPLES</text>
<text x="935" y="31" text-anchor="end" font-size="11" class="muted">SEE THE STORIES BELOW ↓</text>
<!-- photography -->
<rect x="18" y="46" width="297" height="208" rx="12" fill="#122333" stroke="#39746e"/>
<rect x="18" y="46" width="297" height="4" rx="2" fill="#35d0ba"/>
<text x="35" y="72" font-size="12" class="cyan">01 / PHOTOGRAPHY</text>
<text x="35" y="91" font-size="10" class="muted">COMPOSITION · LIGHT · DETAIL</text>
<g fill="none" stroke="#35d0ba">
  <rect x="91" y="122" width="142" height="75" rx="10" fill="#0c1a29" stroke-width="2"/>
  <path d="M116 122l9-15h38l8 15M198 136h17" stroke-width="2"/>
  <circle cx="162" cy="155" r="30" stroke="#527f83" stroke-width="2"/>
  <circle cx="162" cy="155" r="22" stroke-width="2" class="focus"/>
  <g class="rotate"><path d="M162 134l15 8-1 15-14 9-15-10v-14z" stroke="#69dace" opacity=".82"/></g>
  <path d="M81 114h-12v13m104 78h12v-13" stroke="#a1f0e7" opacity=".5"/>
</g>
<text x="35" y="236" font-size="11" class="muted">FRAMING → VISUAL HIERARCHY</text>
<!-- aerial -->
<rect x="332" y="46" width="296" height="208" rx="12" fill="#172138" stroke="#5b5b94"/>
<rect x="332" y="46" width="296" height="4" rx="2" fill="#a493f3"/>
<text x="349" y="72" font-size="12" class="violet">02 / AERIAL VIDEO</text>
<text x="349" y="91" font-size="10" class="muted">PERSPECTIVE · DEPTH · MOTION</text>
<g fill="none" stroke="#b0a3ff" stroke-width="2">
  <path d="M374 186Q420 158 464 190T574 158" stroke="#62719b" stroke-width="2" class="path"/>
  <g class="float">
    <path d="M438 141L486 154L534 141M438 141L486 126L534 141" stroke-width="3"/>
    <path d="M452 141h-19m82 0h24" stroke-width="5" stroke-linecap="round"/>
    <rect x="470" y="135" width="32" height="22" rx="8" fill="#1b2846" stroke-width="2"/>
    <circle cx="486" cy="157" r="7" fill="#14243c" stroke="#67e3de"/>
    <path d="M433 135h10m86 0h10" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="rotorL" stroke="#b3a5f9" opacity=".8"><path d="M416 141h44M438 124v34"/></g>
  <g class="rotorR" stroke="#b3a5f9" opacity=".8"><path d="M512 141h44M534 124v34"/></g>
</g>
<text x="349" y="236" font-size="11" class="muted">MOVEMENT → INTERACTION DESIGN</text>
<!-- aviation -->
<rect x="645" y="46" width="297" height="208" rx="12" fill="#222230" stroke="#8b774c"/>
<rect x="645" y="46" width="297" height="4" rx="2" fill="#f5c451"/>
<text x="662" y="72" font-size="12" class="gold">03 / AVIATION</text>
<text x="662" y="91" font-size="10" class="muted">PRECISION · SYSTEMS · PROCEDURES</text>
<g fill="none" stroke="#e2c377">
  <circle cx="795" cy="158" r="54" stroke="#746747" stroke-width="1.6"/>
  <circle cx="795" cy="158" r="38" stroke="#8d7c4c" stroke-dasharray="5 10" class="scope"/>
  <path d="M740 158h110M795 104v108" stroke="#675b43" stroke-dasharray="4 5"/>
  <path d="M765 178l30-33 30 33" stroke="#f5c451" stroke-width="2.3"/>
  <path d="M795 125v64m-30-27 30-13 30 13" stroke="#e2c377" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M790 126l5-11 5 11M786 185l9 14 9-14" stroke="#e2c377" stroke-width="2"/>
  <circle cx="795" cy="145" r="3.5" fill="#35d0ba" stroke="none" class="ping"/>
</g>
<text x="662" y="236" font-size="11" class="muted">CHECKLISTS → RELIABLE SYSTEMS</text>
<path d="M24 271H936" stroke="url(#tint)" stroke-width="2" stroke-dasharray="14 7" class="path"/>
<text x="480" y="285" font-size="10" class="muted" text-anchor="middle">OBSERVE CAREFULLY  /  DESIGN INTENTIONALLY  /  EXECUTE PRECISELY</text>
</svg>