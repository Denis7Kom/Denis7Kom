<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-label="Development workflow: understand, build, test, refine"><title>Development workflow: understand, build, test, refine</title><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#263446" fill="none" opacity=".35"/></pattern><linearGradient id="bg"><stop stop-color="#172231"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>text{font-family:Consolas,'Liberation Mono',monospace;fill:#e6edf3}.muted{fill:#91a0b5}.green{fill:#35d0ba}.gold{fill:#f5c451}.blink{animation:blink 1.2s steps(1) infinite}.walk{animation:walk 8s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.packet{stroke-dasharray:12 220;animation:packet 5s linear infinite}@keyframes blink{50%{opacity:0}}@keyframes walk{0%{transform:translateX(0)}50%{transform:translateX(70px)}100%{transform:translateX(0)}}@keyframes pulse{50%{opacity:.35}}@keyframes packet{to{stroke-dashoffset:-464}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="160" rx="14" fill="url(#bg)"/><rect width="960" height="160" rx="14" fill="url(#grid)"/><text x="30" y="30" font-size="11" class="muted" letter-spacing="2">FROM IDEA TO WORKING SOFTWARE</text><path d="M130 91H830" stroke="#39475b" stroke-width="3"/><path class="packet" d="M130 91H830" stroke="#35d0ba" stroke-width="3"/><rect x="25" y="62" width="190" height="61" rx="6" fill="#0d1117" stroke="#35d0ba"/><text x="120" y="97" text-anchor="middle" font-size="15">UNDERSTAND</text><rect x="265" y="62" width="190" height="61" rx="6" fill="#0d1117" stroke="#35d0ba"/><text x="360" y="97" text-anchor="middle" font-size="15">BUILD</text><rect x="505" y="62" width="190" height="61" rx="6" fill="#0d1117" stroke="#35d0ba"/><text x="600" y="97" text-anchor="middle" font-size="15">TEST</text><rect x="745" y="62" width="190" height="61" rx="6" fill="#0d1117" stroke="#f5c451"/><text x="840" y="97" text-anchor="middle" font-size="15">REFINE</text></svg>