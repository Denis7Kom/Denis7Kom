<svg xmlns="http://www.w3.org/2000/svg" width="960" height="206" viewBox="0 0 960 206" role="img" aria-labelledby="title desc"><title id="title">Cybersecurity learning lab</title><desc id="desc">Illustrative network packets pass between client, API and access checks. No scan or security claim is implied.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25394f" stroke-opacity=".35" stroke-width=".6"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,"Liberation Mono",monospace} .muted{fill:#99adc7} .bright{fill:#eef5ff} .cyan{fill:#67e8f9} .purple{fill:#b4a0ff}.packet{animation:packets 6s linear infinite}.shield{animation:shield 5s ease-in-out infinite}@keyframes packets{to{stroke-dashoffset:-240}}@keyframes shield{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".75" y=".75" width="958.5" height="204.5" rx="22" fill="#09111f" stroke="#25344a" stroke-width="1.5"/><rect x="2" y="2" width="956" height="202" rx="20" fill="url(#grid)"/>
<text x="28" y="34" font-size="12" fill="#67e8f9" class="mono">LEARNING / SECURITY</text><text x="28" y="68" font-size="24" fill="#eef5ff">Understand the system.</text><text x="28" y="99" font-size="15" fill="#9eafc6">Test assumptions. Document the result.</text>
<path d="M490 83H592M687 83H788" stroke="#304b65" stroke-width="2"/><path class="packet" d="M490 83H592M687 83H788" stroke="#67e8f9" stroke-width="2" stroke-dasharray="9 111"/>
<g fill="#102238" stroke="#35526d"><rect x="422" y="52" width="70" height="64" rx="12"/><rect x="593" y="52" width="93" height="64" rx="12"/><rect x="790" y="52" width="116" height="64" rx="12"/></g>
<text x="439" y="90" font-size="15" fill="#afc6e1" class="mono">WEB</text><text x="622" y="90" font-size="15" fill="#afc6e1" class="mono">API</text><text x="807" y="90" font-size="15" fill="#afc6e1" class="mono">ACCESS</text>
<text x="28" y="162" font-size="12" fill="#a5c5e8" class="mono">READ CODE</text><text x="203" y="162" font-size="12" fill="#a5c5e8" class="mono">TEST BEHAVIOUR</text><text x="430" y="162" font-size="12" fill="#a5c5e8" class="mono">CHECK BOUNDARIES</text><text x="687" y="162" font-size="12" fill="#a5c5e8" class="mono">WRITE IT DOWN</text><path class="shield" d="M896 144L912 149V160Q912 171 896 178Q880 171 880 160V149Z" fill="none" stroke="#67e8f9" stroke-width="1.5"/></svg>
