<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">DEN7BEST: software, web applications and application security</title>
  <desc id="d">Dark avionics-style banner with the name DEN7BEST, a short role line, the city Naples and an open-to-work badge.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .scan{animation:scan 7s linear infinite}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1040px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16202b" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5ad1ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5ad1ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="238" rx="14" fill="#0b0f14" stroke="#243242" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="238" rx="14" fill="url(#grid)"/>
  <rect class="scan" x="0" y="2" width="160" height="236" fill="url(#sweep)"/>

  <g class="m" fill="#7a8ba0" font-size="13">
    <text x="48" y="52">// PROFILE · NAV-01</text>
  </g>

  <g>
    <rect x="768" y="30" width="184" height="34" rx="17" fill="#0f1a16" stroke="#3ddc97" stroke-width="1.5"/>
    <circle class="pulse" cx="792" cy="47" r="5" fill="#3ddc97"/>
    <text class="m" x="808" y="52" font-size="13" font-weight="700" fill="#3ddc97">OPEN TO WORK</text>
  </g>

  <text class="m" x="48" y="122" font-size="64" font-weight="700" fill="#e6f1ff">DEN7BEST<tspan class="blink" fill="#3ddc97">_</tspan></text>
  <text class="m" x="50" y="160" font-size="20" fill="#5ad1ff">Software · Web applications · Application security</text>
  <text class="m" x="50" y="196" font-size="15" fill="#9fb3c8">Naples, Italy  ·  Computer Science (L-31), University of Salerno</text>

  <g stroke="#3ddc97" stroke-width="2" fill="none" opacity=".8">
    <path d="M48 214H952" stroke="#243242"/>
    <path d="M48 214H168"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
