<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 254" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Application security review loop</title>
  <desc id="d">Four steps that repeat: define the boundary, find the assumption, test the failure, verify the fix. A status line says this is learning, with no audit claimed.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .n{stroke:#243242;fill:#111821}
    .hl{opacity:0;animation:hl 8s linear infinite}
    @keyframes hl{0%{opacity:0}2%,25%{opacity:1}27%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.hl{opacity:0!important}}
  </style>
  <rect x="1" y="1" width="898" height="252" rx="14" fill="#0b0f14" stroke="#243242" stroke-width="2"/>
  <text class="m" x="36" y="44" font-size="18" font-weight="700" fill="#e6f1ff">Security review loop</text>

  <g class="m" font-size="13" text-anchor="middle">
    <rect class="n" x="36" y="70" width="190" height="64" rx="10" stroke-width="1.5"/>
    <rect class="n" x="246" y="70" width="190" height="64" rx="10" stroke-width="1.5"/>
    <rect class="n" x="456" y="70" width="190" height="64" rx="10" stroke-width="1.5"/>
    <rect class="n" x="666" y="70" width="198" height="64" rx="10" stroke-width="1.5"/>

    <rect class="hl" x="36" y="70" width="190" height="64" rx="10" fill="none" stroke="#3ddc97" stroke-width="3" style="animation-delay:0s"/>
    <rect class="hl" x="246" y="70" width="190" height="64" rx="10" fill="none" stroke="#3ddc97" stroke-width="3" style="animation-delay:2s"/>
    <rect class="hl" x="456" y="70" width="190" height="64" rx="10" fill="none" stroke="#3ddc97" stroke-width="3" style="animation-delay:4s"/>
    <rect class="hl" x="666" y="70" width="198" height="64" rx="10" fill="none" stroke="#3ddc97" stroke-width="3" style="animation-delay:6s"/>

    <text x="131" y="98" fill="#5ad1ff" font-weight="700">01 BOUNDARY</text>
    <text x="131" y="118" fill="#9fb3c8" font-size="12">where input enters</text>
    <text x="341" y="98" fill="#5ad1ff" font-weight="700">02 ASSUMPTION</text>
    <text x="341" y="118" fill="#9fb3c8" font-size="12">what is trusted</text>
    <text x="551" y="98" fill="#5ad1ff" font-weight="700">03 FAILURE</text>
    <text x="551" y="118" fill="#9fb3c8" font-size="12">try to break it</text>
    <text x="765" y="98" fill="#5ad1ff" font-weight="700">04 VERIFY</text>
    <text x="765" y="118" fill="#9fb3c8" font-size="12">retest after the fix</text>
  </g>

  <g fill="#7a8ba0">
    <path d="M240 102l-8-5v10z"/>
    <path d="M450 102l-8-5v10z"/>
    <path d="M660 102l-8-5v10z"/>
  </g>

  <text class="m" x="36" y="176" font-size="14" fill="#f5c451">STATUS: learning</text>
  <text class="m" x="36" y="200" font-size="13" fill="#9fb3c8">Studied: OWASP Top 10, SQL injection. No audit, certification or reported vulnerability is claimed.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata>  <text class="m" x="36" y="224" font-size="13" fill="#9fb3c8">Following: annual Cisco cybersecurity events and 404 Media security coverage.</text>
</svg>
